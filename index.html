  <style>
/* Thème « Pop » : clair bleu électrique / rouge par défaut, « nuit » bleu marine en option (bouton ◐). Mobile d'abord : barre d'onglets en bas, panneau de saisie qui monte du bas. */
:root {
  color-scheme: light;
  --display: Archivo, Inter, system-ui, sans-serif;
  --bleu: #0a3cff; --nuit: #071a52; --rouge: #ff1f4b; --corail: #ff7a59;
  --hero: linear-gradient(150deg, #0a3cff 0%, #071a52 100%);
  --pop: linear-gradient(135deg, #ff1f4b, #ff7a59);
  --page: #f1f4ff;
  --page-glow: radial-gradient(900px 500px at 100% -10%, rgba(10, 60, 255, .08), transparent 60%);
  --sidebar: #071a52;
  --surface: #ffffff;
  --surface-2: #eef2ff;
  --surface-3: #dfe6ff;
  --border: rgba(7, 26, 82, .07);
  --shadow: 0 8px 24px -16px rgba(7, 26, 82, .35);
  --text: #0b1433;
  --text-2: #3d4766;
  --muted: #66708f;
  --grid: rgba(7, 26, 82, .06);
  --axis: rgba(7, 26, 82, .14);
  --series-1: #0a3cff; --series-2: #ff1f4b; --series-3: #8fb0ff; --series-4: #ffb020;
  --series-5: #13c98f; --series-6: #7a5cff; --series-7: #00b8d9; --series-8: #8a94a2;
  --good: #13c98f; --warning: #ffb020; --critical: #ff1f4b;
  --good-text: #07885e; --warning-text: #b36b00; --critical-text: #d3123a;
  --accent: #0a3cff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(10, 60, 255, .10);
  --radius: 24px;
  --radius-sm: 14px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --hero: linear-gradient(150deg, #1d4dff 0%, #0a1a4d 100%);
  --page: #050d2b;
  --page-glow: radial-gradient(1000px 600px at 100% -10%, rgba(29, 77, 255, .28), transparent 60%), radial-gradient(800px 500px at 0% 110%, rgba(255, 31, 75, .10), transparent 60%);
  --sidebar: #030924;
  --surface: #0d1a45;
  --surface-2: #16255a;
  --surface-3: #22336e;
  --border: rgba(255, 255, 255, .07);
  --shadow: 0 10px 28px -18px rgba(0, 0, 0, .7);
  --text: #f3f6ff;
  --text-2: #bcc6e6;
  --muted: #8592bd;
  --grid: rgba(255, 255, 255, .06);
  --axis: rgba(255, 255, 255, .14);
  --series-1: #4d7bff; --series-2: #ff4d6d; --series-3: #6f8fe0; --series-4: #ffc53d;
  --series-5: #2fe0a6; --series-6: #9b85ff; --series-7: #35d0ee; --series-8: #a0a8c4;
  --good: #2fe0a6; --warning: #ffc53d; --critical: #ff4d6d;
  --good-text: #4ae8b4; --warning-text: #ffc53d; --critical-text: #ff6b85;
  --accent: #4d7bff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(77, 123, 255, .20);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page-glow), var(--page); background-attachment: fixed; color: var(--text);
  font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; min-height: 100vh;
}
body.no-scroll { overflow: hidden; }
a { color: var(--accent); }
h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
h3 { font-size: 13px; font-weight: 700; margin: 16px 0 6px; color: var(--text-2); }
ul, ol { padding-left: 20px; margin: 6px 0; }
li { margin: 3px 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; padding: 40px; }
.hidden { display: none !important; }
.good { color: var(--good-text); } .warn { color: var(--warning-text); } .bad { color: var(--critical-text); }

/* Navigation : barre latérale (ordinateur) / barre du bas (téléphone) */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 96px; z-index: 10;
  display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 18px 8px;
  background: var(--sidebar); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-right: 1px solid var(--border);
}
.brand { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; text-decoration: none; font-size: 20px; }
.tabs { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 4px; border-radius: 14px; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; }
.tabs a svg { width: 22px; height: 22px; fill: currentColor; }
.tabs a .t-c { display: none; }
.tabs a.on { color: var(--text); background: var(--accent-soft); }
.tabs a.on svg { fill: var(--accent); }
.tools { position: fixed; left: 0; bottom: 18px; width: 96px; z-index: 12; display: flex; flex-direction: column; align-items: center; gap: 8px; }
main { margin-left: 96px; padding: 28px 32px 110px; max-width: 1240px; }

.pill { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.pill.good { color: var(--good-text); } .pill.warn { color: var(--warning-text); } .pill.bad { color: var(--critical-text); background: rgba(255, 92, 100, .12); }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 15px; display: inline-grid; place-items: center; flex: none; }
.icon-btn.sm { width: 30px; height: 30px; font-size: 12px; border-radius: 10px; }
.fab { position: fixed; right: 24px; bottom: 24px; z-index: 11; width: 58px; height: 58px; border-radius: 20px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 30px; font-weight: 500; cursor: pointer; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }

@media (max-width: 760px) {
  body { font-size: 15px; }
  .sidebar { inset: auto 0 0 0; width: auto; height: auto; flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--border); gap: 0; }
  .brand, .tools .icon-btn { display: none; }
  .tabs { flex-direction: row; justify-content: space-around; }
  .tabs a { flex: 1; min-width: 0; padding: 6px 1px; font-size: 9.5px; }
  .tabs a .t-l { display: none; } .tabs a .t-c { display: block; }
  .tabs a span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { top: 16px; right: 16px; left: auto; bottom: auto; width: auto; }
  main { margin: 0; padding: 18px 16px calc(96px + env(safe-area-inset-bottom)); }
  .fab { right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); }
  h1 { font-size: 24px; padding-right: 96px; }
}

/* Page */
.page-head { margin-bottom: 16px; }
.page-head p { margin: 4px 0 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
.grid .wide { grid-column: 1 / -1; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; gap: 12px; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; min-width: 0; margin-bottom: 0; }
main > .card { margin-bottom: 16px; }
.kpi { margin: 0 0 6px; } .kpi b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; max-width: 520px; }
.quick button, .big-actions button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
.quick button span, .big-actions button span { font-size: 24px; }
.big-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.big-actions button { padding: 22px 8px; background: var(--surface-2); }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 4px 0 8px; }
.bar span { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar span.over { background: var(--warning); }
.bar.p span { background: var(--series-3); } .bar.f span { background: var(--series-4); }
.bar.p span.over, .bar.f span.over { background: var(--good); }
.mini-bars { display: grid; gap: 2px; margin: 8px 0; }

.list { display: flex; flex-direction: column; margin-top: 6px; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); text-align: left; }
.li:first-child { border-top: 0; }
.li-btn { background: none; border: 0; border-top: 1px solid var(--border); color: inherit; font: inherit; cursor: pointer; width: 100%; }
.li-btn:first-child { border-top: 0; }
.li-end { display: flex; align-items: center; gap: 6px; flex: none; text-align: right; flex-direction: row; }
.li-end:has(> .muted.small) { flex-direction: column; align-items: flex-end; gap: 0; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); margin-left: 4px; }
.badge.good { background: var(--accent-soft); color: var(--good-text); }
.note { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; color: var(--text-2); }

/* Calendrier */
.btn.sm { padding: 6px 12px; font-size: 13px; min-height: 0; }
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-head h2 { margin: 0; flex: 1; text-align: center; text-transform: capitalize; }
.cal-grille { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-jn { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; padding-bottom: 2px; }
.cal-j { min-height: 86px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 6px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; cursor: pointer; text-align: left; min-width: 0; }
.cal-j:hover { border-color: var(--accent); }
.cal-j.hors { opacity: .4; }
.cal-j.auj { border: 2px solid var(--accent); }
.cal-j.auj .cal-n { background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 6px; }
.cal-n { font-size: 12px; font-weight: 700; align-self: flex-start; }
.cal-evs { display: flex; flex-wrap: wrap; gap: 3px; }
.ev { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; font-size: 13px; line-height: 1; border: 2px solid var(--c, var(--muted)); }
.ev.fait { background: var(--c); }
.ev.a-venir { background: transparent; border-style: dashed; }
.ev.non-fait { border-color: var(--border); background: transparent; filter: grayscale(1); opacity: .5; }
.cal-leg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.cal-leg .ev { width: 14px; height: 14px; border-radius: 4px; margin-left: 8px; }
.cal-leg .ev:first-child { margin-left: 0; }
.ag { align-items: flex-start; justify-content: flex-start; }
.ag-d { flex: none; width: 74px; font-weight: 700; font-size: 13px; padding-top: 1px; }
.ag.auj .ag-d { color: var(--accent); }
.ag-l { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ag-l .non-fait { color: var(--muted); }
.badge.prevu { background: transparent; border: 1px dashed var(--accent); color: var(--accent); }
@media (max-width: 760px) {
  .cal { padding: 12px 8px; }
  .cal-grille { gap: 2px; }
  .cal-j { min-height: 56px; padding: 3px; gap: 2px; border-radius: 8px; }
  .ev { width: 18px; height: 18px; font-size: 10px; border-radius: 5px; border-width: 1.5px; }
  .cal-head .btn.sm { padding: 5px 8px; font-size: 12px; }
}

.chart { position: relative; height: 260px; }
.chart.sm { height: 200px; margin-bottom: 12px; }
.chart.xs { height: 150px; margin-top: 8px; }
/* Nutrition : journal par repas */
.journal { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 16px; }
.jr-moment { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 12px; }
.jr-titre { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 2px; }
.jr-moment .li { padding: 8px 0; }
/* Muscu : tableau de bord par exercice */
/* Séance : changer un exercice pour cette séance */
.exo-liens { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px; }
.exo-edit { border: 1px dashed var(--accent); border-radius: var(--radius-sm); padding: 10px 12px; margin: 10px 0; }
.exo-edit .actions { margin-top: 6px; }
.exo-plus { width: 100%; margin: 10px 0 4px; border-style: dashed; }
/* Mes séances (Muscu) et créateur de séance */
.seances-types { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 18px; }
.seances-types .chip.plus { border-style: dashed; color: var(--accent); }
label.check { display: flex; flex-direction: row; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--text); }
label.check input { width: 20px; height: 20px; flex: none; padding: 0; accent-color: var(--accent); }
.ed-bloc { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin: 12px 0; background: var(--surface-2); }
.ed-bloc h3 { margin: 0; }
.ed-bloc-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.ed-bloc-h input { flex: 1; font-weight: 700; }
.ed-btns { display: inline-flex; gap: 4px; margin-left: auto; }
.ed-btns .icon-btn:disabled { opacity: .3; }
.ed-exo { border-top: 1px solid var(--border); padding: 8px 0; }
.ed-exo-h { display: flex; align-items: center; gap: 8px; }
.ed-exo-h b { flex: 0 1 auto; }
.ed-exo-v { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.ed-exo-v label { font-size: 11px; color: var(--muted); }
.ed-exo-v input { padding: 8px 4px; text-align: center; }
.ed-choix { border: 1px dashed var(--accent); border-radius: var(--radius-sm); padding: 10px; margin-top: 8px; background: var(--surface); }
.ed-liste { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.ed-liste .chip:disabled { opacity: .35; }
.ed-perso { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 6px; margin-bottom: 6px; }
.ed-perso select { padding: 10px 6px; }
.err { color: var(--critical-text); min-height: 1em; }
.tendance { margin-bottom: 22px; }
.td-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.td-tete h2 { margin: 0; font-size: 16px; }
.td-tuiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 10px; }
.td-tuile { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text-2); }
.td-tuile b { display: block; font-size: 24px; font-weight: 800; line-height: 1.1; }
.td-tuile span { font-size: 12px; font-weight: 600; }
.td-tuile.good { background: var(--accent-soft); color: var(--good-text); }
.td-tuile.warn { color: var(--warning-text); }
.td-alerte { margin: 0; background: var(--surface-2); border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text-2); }
.td-alerte i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warning-text); margin-right: 8px; }
.td-alerte .lien { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--text); text-decoration: underline; cursor: pointer; }
.exo-groupe { margin-bottom: 22px; }
.exo-groupe h2 { margin: 0; }
details.exo-groupe summary { display: flex; align-items: baseline; gap: 10px; cursor: pointer; list-style: none; }
details.exo-groupe summary::-webkit-details-marker { display: none; }
details.exo-groupe summary h2::before { content: '▸ '; color: var(--muted); }
details.exo-groupe[open] summary h2::before { content: '▾ '; }
.exo-grid { margin-top: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.exo-card { display: block; width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.exo-card:hover { border-color: var(--accent); }
.exo-card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.exo-card-k { margin: 6px 0 2px; }
.exo-card p { margin-top: 4px; margin-bottom: 0; }

/* Formulaires */
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-2); margin: 8px 0; min-width: 0; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.grid5 input { padding: 10px 6px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 520px) { .grid4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 420px) { .grid5 { grid-template-columns: repeat(3, 1fr); } }
.check-line { flex-direction: row; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--text); margin: 4px 0; }
.check-line input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.check-line.barre span { text-decoration: line-through; opacity: .55; }
.btn { font: inherit; font-weight: 600; padding: 11px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--critical-text); }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; align-items: center; }
.actions.wrap { flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-align: left; }
.link b { color: var(--text); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
[data-chips="rpe"] { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
[data-chips="rpe"] .chip { padding: 9px 0; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { font: inherit; font-weight: 700; width: 48px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; flex: none; }
.stepper label { flex-direction: row; align-items: center; margin: 0; flex: 1; font-size: 14px; }
.stepper input { text-align: center; font-weight: 700; }
.stepper.sm { gap: 4px; } .stepper.sm button { width: 28px; height: 28px; border-radius: 8px; }
.stepper.sm b { min-width: 18px; text-align: center; }

/* Séance : exercices et séries */
.exo { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px; margin: 8px 0; }
.exo p { margin: 2px 0 8px; }
.exo-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.serie { display: grid; grid-template-columns: 26px 1fr 64px 12px 70px 44px; gap: 6px; align-items: center; padding: 4px 0; }
.serie.aidee { grid-template-columns: 26px 1fr 56px 30px 64px 44px; }
.serie input { padding: 9px 4px; text-align: center; background: var(--surface); }
.serie .sn { font-size: 12px; font-weight: 700; color: var(--muted); }
.serie .prevu { font-size: 12px; color: var(--muted); }
.serie .x { color: var(--muted); text-align: center; font-size: 12px; }
.check { height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 18px; cursor: pointer; }
.serie.done .check { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.serie.done input { border-color: var(--accent); }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--border); }
.tbl td { padding: 7px 4px; border-bottom: 1px solid var(--border); }
.ecart.ok { color: var(--muted); } .ecart.plus { color: var(--good-text); } .ecart.moins { color: var(--warning-text); } .ecart.nonfaite { color: var(--critical-text); }
.macros { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; margin: 10px 0; }
.macros div { background: var(--surface-2); border-radius: 12px; padding: 8px 2px; display: flex; flex-direction: column; }
.macros b { font-size: 18px; } .macros span { font-size: 11px; color: var(--muted); }
.pick-list { max-height: 38vh; overflow-y: auto; margin: 8px 0; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 10px; }
.pick-list h3 { margin-top: 10px; }
.pick { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 10px 8px; margin: 2px 0; border: 0; border-radius: 10px; background: none; color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
.pick .muted { font-size: 12px; white-space: nowrap; }
.pick.on { background: var(--accent-soft); outline: 1px solid var(--accent); }

/* Panneau de saisie */
.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 620px; max-height: 92vh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; border: 1px solid var(--border); }
@media (min-width: 761px) { .sheet-back { align-items: center; } .sheet { border-radius: 22px; max-height: 88vh; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 6px; }
.sheet-head h2 { margin: 0; text-transform: none; letter-spacing: 0; font-size: 18px; color: var(--text); }
.sheet-body { overflow-y: auto; padding: 4px 16px calc(18px + env(safe-area-inset-bottom)); }
.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: var(--surface-3); color: var(--text); padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); transition: opacity .3s; max-width: calc(100vw - 32px); }
.toast.out { opacity: 0; }

/* ---------- Style « Pop » : typo d'affichage, cartes à ombre, bandeaux en couleur ---------- */
h1, .kpi b, .td-tuile b, .macros b, .brand { font-family: var(--display); font-weight: 900; letter-spacing: -.025em; }
h1 { font-size: 32px; }
h2 { font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: .14em; color: var(--muted); }
.card { border-color: transparent; box-shadow: var(--shadow); }
.btn, .chip, .quick button { font-family: var(--display); font-weight: 800; }
.btn { border-radius: 99px; padding: 11px 18px; }
.btn.primary { box-shadow: 0 8px 18px -10px var(--accent); }
.chip { background: var(--surface); border-color: transparent; box-shadow: var(--shadow); color: var(--text); }
.chip.on { background: var(--nuit); color: #fff; }
:root[data-theme="dark"] .chip.on { background: var(--accent); }
.seances-types .chip.plus { background: var(--rouge); color: #fff; border: 0; }
.badge.good { background: rgba(19, 201, 143, .16); }

/* Navigation bleu nuit dans les deux thèmes */
.tabs a { color: rgba(255, 255, 255, .6); }
.tabs a.on { color: #fff; background: rgba(255, 255, 255, .12); }
.tabs a.on svg { fill: #fff; }
.brand { background: var(--rouge); color: #fff; }
.sidebar { border: 0; }
.fab { background: var(--rouge); color: #fff; font-family: var(--display); font-weight: 900; box-shadow: 0 12px 24px -8px rgba(255, 31, 75, .7); }
@media (max-width: 760px) {
  .sidebar { inset: auto 10px calc(10px + env(safe-area-inset-bottom)) 10px; padding: 6px; border-radius: 24px; box-shadow: 0 14px 30px -12px rgba(7, 26, 82, .6); }
  .tabs a { border-radius: 16px; }
  main { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
  .fab { bottom: calc(92px + env(safe-area-inset-bottom)); }
}

/* Accès rapides : tuiles blanches, icône dans une pastille */
.quick button { border: 0; box-shadow: 0 10px 24px -14px rgba(10, 60, 255, .55); font-size: 14px; }
.quick button span { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 21px; background: var(--surface-2); }
.quick [data-a="repas"] span { background: rgba(255, 31, 75, .12); }
.quick [data-a="poids"] span { background: rgba(255, 176, 32, .18); }

/* Bandeau bleu (calories du jour) */
.card.hero { position: relative; overflow: hidden; background: var(--hero); color: #fff; }
.card.hero::before { content: ""; position: absolute; right: -70px; top: -70px; width: 200px; height: 200px; border-radius: 50%; border: 24px solid rgba(255, 255, 255, .09); box-shadow: 0 0 0 24px rgba(255, 255, 255, .04); pointer-events: none; }
.card.hero::after { content: ""; position: absolute; right: 40px; top: 44px; width: 34px; height: 34px; border-radius: 50%; background: var(--rouge); box-shadow: 0 8px 24px rgba(255, 31, 75, .6); pointer-events: none; }
.card.hero > * { position: relative; }
.card.hero h2, .card.hero .muted, .card.hero .small { color: rgba(255, 255, 255, .78); }
.card.hero .warn { color: #ffd166; }
.card.hero .kpi b { font-size: 56px; line-height: .95; color: #fff; }
.card.hero .bar { background: rgba(255, 255, 255, .18); height: 12px; }
.card.hero .bar span { background: linear-gradient(90deg, #fff, #ffd1db); }
.card.hero .bar span.over { background: #ffd166; }
.card.hero .bar.p span { background: #8fb0ff; } .card.hero .bar.f span { background: #6ef0c2; }
.card.hero .li { border-color: rgba(255, 255, 255, .12); }
.card.hero b { color: #fff; }
.card.hero .icon-btn { background: rgba(255, 255, 255, .12); border-color: transparent; color: #fff; }

/* Carte rouge (prochaine séance) */
.card.pop { position: relative; overflow: hidden; background: var(--pop); color: #fff; }
.card.pop::after { content: ""; position: absolute; right: -30px; bottom: -50px; width: 150px; height: 150px; border-radius: 50%; border: 22px solid rgba(255, 255, 255, .18); pointer-events: none; }
.card.pop > * { position: relative; z-index: 1; }
.card.pop h2, .card.pop .muted { color: rgba(255, 255, 255, .85); }
.card.pop .kpi b { font-size: 36px; text-transform: uppercase; }
.card.pop .btn.primary { background: #fff; color: var(--rouge); box-shadow: none; }

/* Tendance Muscu : carte bleu nuit, tuiles en couleur */
.card.tendance { background: var(--nuit); color: #fff; }
:root[data-theme="dark"] .card.tendance { background: var(--surface); }
.card.tendance h2 { color: #fff; }
.card.tendance .muted { color: rgba(255, 255, 255, .65); }
.card.tendance .td-tuile { background: rgba(255, 255, 255, .10); color: rgba(255, 255, 255, .85); border-radius: 18px; }
.card.tendance .td-tuile b { font-size: 30px; }
.card.tendance .td-tuile.good { background: var(--good); color: #04261b; }
.card.tendance .td-tuile.warn { background: var(--rouge); color: #fff; }
.card.tendance .td-alerte { background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .8); }
.card.tendance .td-alerte i { background: var(--rouge); }
.card.tendance .td-alerte .lien { color: #fff; text-decoration-color: var(--rouge); text-decoration-thickness: 2px; }

  <script>
/* Calculs purs (sans DOM ni stockage) : dates, cibles nutritionnelles, charge d'entraînement, muscu, menus, courses.
   Testés par tests.html. */

/* ---------- Dates (chaînes AAAA-MM-JJ, heure locale) ---------- */
const pad2 = n => String(n).padStart(2, '0');
function isoDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function parseIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseIso(s); d.setDate(d.getDate() + n); return isoDate(d); }
function diffDays(a, b) { return Math.round((parseIso(a) - parseIso(b)) / 86400000); }
// Lundi de la semaine de la date

const ORDRE_MOMENTS = ['Petit-déjeuner', 'Déjeuner', 'Collation', 'Dîner'];

    if (init) init($('.sheet-body', el));
    return el;
  },
  corps() { return this.el && $('.sheet-body', this.el); },
  fermer() {
    if (!this.el) return;
    this.el.remove(); this.el = null;
    document.body.classList.remove('no-scroll');
  },
};

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('out'), 2200);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- Composants ---------- */
function barre(valeur, cible, { classe = '' } = {}) {
  const pct = cible ? Math.min(100, valeur / cible * 100) : 0;
  const trop = cible && valeur > cible;
  return `<div class="bar ${classe}"><span style="width:${pct}%" class="${trop ? 'over' : ''}"></span></div>`;
}
function chips(nom, options, actif) {
  return `<div class="chips" data-chips="${nom}">${options.map(o =>
    `<button type="button" class="chip ${String(o.v) === String(actif) ? 'on' : ''}" data-v="${esc(o.v)}">${o.l}</button>`).join('')}</div>`;
}
// Active les groupes de chips d'un conteneur ; onChange(nom, valeur)
function brancherChips(root, onChange) {
  $$('[data-chips]', root).forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    $$('.chip', g).forEach(x => x.classList.toggle('on', x === b));
    onChange && onChange(g.dataset.chips, b.dataset.v);
  }));
}
const valeurChips = (root, nom) => { const b = $(`[data-chips="${nom}"] .chip.on`, root); return b ? b.dataset.v : null; };
const num = v => { if (v == null || v === '') return null; const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; };

/* ---------- Graphiques (Chart.js) ---------- */
const Graphs = {
  liste: [],
  detruire() { this.liste.forEach(c => c.destroy()); this.liste = []; },
  creer(canvas, config) {
    if (typeof Chart === 'undefined' || !canvas) return null;
    const c = new Chart(canvas, config);
    this.liste.push(c);
    return c;
  },
  base() {
    const grid = css('--grid'), text = css('--muted');
    return {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: text, boxWidth: 10, boxHeight: 10, usePointStyle: true } }, tooltip: { backgroundColor: css('--surface-3'), titleColor: css('--text'), bodyColor: css('--text-2') } },
      scales: {
        x: { grid: { display: false }, ticks: { color: text, maxRotation: 0, autoSkipPadding: 12 }, border: { color: css('--axis') } },
        y: { grid: { color: grid }, ticks: { color: text }, border: { display: false } },
      },
    };
  },
};
const COULEUR_SPORT = { muscu: '--series-1', foot: '--series-2', velo: '--series-3', squash: '--series-4', padel: '--series-5', tennis: '--series-6', course: '--series-7', autre: '--series-8' };
const couleurSport = id => css(COULEUR_SPORT[id] || '--series-8');

  <script>
/* Formulaires de saisie : séance (muscu ou autre sport), repas, poids. Pensés pour le téléphone : peu de touches, tout pré-rempli. */

const RPE_LABELS = { 1: 'Très facile', 2: 'Facile', 3: 'Modéré', 4: 'Un peu dur', 5: 'Dur', 6: 'Dur +', 7: 'Très dur', 8: 'Très dur +', 9: 'Quasi max', 10: 'Max' };
const QTES = [{ v: 0.5, l: '½' }, { v: 1, l: '1' }, { v: 1.5, l: '1½' }, { v: 2, l: '2' }];
const MOMENTS = ['Petit-déjeuner', 'Déjeuner', 'Collation', 'Dîner'];
const momentActuel = () => { const d = new Date(); return momentRepas(d.getHours() + d.getMinutes() / 60); };

const Saisie = {
  menu() {
    Sheet.ouvrir('Ajouter', `<div class="big-actions">
      <button type="button" data-a="seance"><span>🏋️</span>Séance</button>
      <button type="button" data-a="repas"><span>🍽️</span>Repas</button>
      <button type="button" data-a="poids"><span>⚖️</span>Poids</button></div>`, body => {
      body.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) this[b.dataset.a](); });
    });
  },

  /* ---------- Séance ---------- */
  exosDepuisProgramme(ps) {
    return ps.blocs.flatMap(b => b.exos.map(ex => {
      const pv = prevuExo(ex, Store.data.seances);
      return {
        id: ex.id, nom: ex.nom, bloc: b.nom, unite: ex.unite, consigne: ex.consigne, pret: pv.chargeSuggeree, ...(ex.assiste ? { assiste: true } : {}),
        series: Array.from({ length: ex.series }, () => ({ prevuReps: pv.reps, prevuCharge: pv.charge, reps: pv.reps, charge: pv.charge, faite: false, ...this.aideSerie(pv) })),
      };
    }));
  },
  // Exercice ajouté ou remplacé pendant la séance : prévu = programme s'il y figure, sinon ce qui a été fait la dernière fois
  exoSeance(def, bloc, nbSeries) {
    const pv = prevuExo({ series: nbSeries, repsMax: null, ...def }, Store.data.seances), der = pv.derniere;
    const n = nbSeries || def.series || (der ? der.series.length : 3);
    return {
      id: def.id, nom: def.nom, bloc, unite: def.unite, consigne: def.consigne, pret: pv.chargeSuggeree, ...(def.assiste ? { assiste: true } : {}),
      series: Array.from({ length: n }, (_, j) => {
        const r = pv.reps ?? (der && der.series[Math.min(j, der.series.length - 1)].reps) ?? null;
        return { prevuReps: r, prevuCharge: pv.charge, reps: r, charge: pv.charge, faite: false, ...this.aideSerie(pv) };
      }),
    };
  },
  // Exercice assisté : aide prévue = celle de la dernière fois (sinon celle du programme)
  aideSerie(pv) { return pv.aide != null ? { prevuAide: pv.aide, aide: pv.aide } : {}; },
  // Exercices connus : programme et historique, puis catalogue intégré (un nom du catalogue garde son id, donc un seul historique)
  catalogueExos() {
    const l = groupesExos(Store.data.programme, Store.data.seances).flatMap(g => g.exos), ids = new Set(l.map(e => e.id));
    const cat = ((typeof SEED !== 'undefined' && SEED.exercices) || []).flatMap(g => g.exos).filter(e => !ids.has(e.id));
    return [...l, ...cat];
  },

  /* ---------- Créateur de séances types ---------- */
  // Groupes proposés : catalogue intégré par groupe musculaire, puis « Mes exercices » (programme et historique hors catalogue)
  groupesCatalogue() {
    const cat = (typeof SEED !== 'undefined' && SEED.exercices) || [], ids = new Set(cat.flatMap(g => g.exos.map(e => e.id)));
    const miens = groupesExos(Store.data.programme, Store.data.seances).flatMap(g => g.exos).filter(e => !ids.has(e.id)).sort((a, b) => a.nom.localeCompare(b.nom));
    return miens.length ? [...cat, { groupe: 'Mes exercices', exos: miens }] : cat;
  },
  editeurSeance(id) {
    const existante = id && (Store.data.programme.seances || []).find(s => s.id === id);
    let st = existante ? JSON.parse(JSON.stringify({ ...existante, rotation: existante.rotation !== false }))
      : { nom: '', rotation: false, blocs: [{ nom: 'Échauffement', exos: [] }, { nom: 'Bloc 1', exos: [] }] };
    if (!st.blocs.some(b => b.nom === 'Échauffement')) st.blocs.unshift({ nom: 'Échauffement', exos: [] });
    const groupes = this.groupesCatalogue(), tous = groupes.flatMap(g => g.exos);
    let choix = null; // { b: bloc où l'on ajoute, groupe affiché }
    const LIB = { s: 'Secondes', min: 'Minutes' };
    const fl = (a, b, j, n, lab) => `<button type="button" class="icon-btn sm" data-a="${a}" data-b="${b}"${j != null ? ` data-e="${j}"` : ''} ${n ? '' : 'disabled'} aria-label="${lab}">${{ haut: '↑', bas: '↓', suppr: '✕' }[a.split('-').pop()]}</button>`;
    const htmlExo = (e, i, j, nb) => `<div class="ed-exo">
        <div class="ed-exo-h"><b>${esc(e.nom)}</b><span class="muted small">${esc(e.unite)}</span>
          <span class="ed-btns">${fl('exo-haut', i, j, j > 0, 'Monter')}${fl('exo-bas', i, j, j < nb - 1, 'Descendre')}${fl('exo-suppr', i, j, true, 'Retirer')}</span></div>
        <div class="ed-exo-v"><label>Séries<input type="number" inputmode="numeric" min="1" max="10" data-b="${i}" data-e="${j}" data-k="series" value="${e.series ?? ''}"></label>
          <label>${LIB[e.unite] || 'Reps'} min<input type="number" inputmode="numeric" data-b="${i}" data-e="${j}" data-k="repsMin" value="${e.repsMin ?? ''}"></label>
          <label>max<input type="number" inputmode="numeric" data-b="${i}" data-e="${j}" data-k="repsMax" value="${e.repsMax ?? ''}"></label>
          ${sansCharge(e.unite) ? '<span></span>' : `<label>Charge kg<input type="text" inputmode="decimal" data-b="${i}" data-e="${j}" data-k="charge" value="${e.charge ?? ''}" placeholder="?"></label>`}</div></div>`;
    const htmlChoix = i => {
      const g = groupes.find(x => x.groupe === choix.groupe) || groupes[0], dans = new Set(st.blocs.flatMap(b => b.exos.map(e => e.id)));
      return `<div class="ed-choix">
        ${chips('groupe', groupes.map(x => ({ v: x.groupe, l: esc(x.groupe) })), g ? g.groupe : '')}
        <div class="ed-liste">${g ? g.exos.map(e => `<button type="button" class="chip" data-a="choisir" data-id="${esc(e.id)}" ${dans.has(e.id) ? 'disabled title="Déjà dans la séance"' : ''}>${esc(e.nom)}</button>`).join('') : ''}</div>
        <div class="ed-perso"><input name="perso-nom" maxlength="60" placeholder="Autre exercice (nom)" list="ed-noms"><select name="perso-unite">${UNITES_EXO.map(u => `<option>${u}</option>`).join('')}</select>
          <button type="button" class="btn sm" data-a="perso">Ajouter</button></div>
        <datalist id="ed-noms">${tous.map(e => `<option value="${esc(e.nom)}">`).join('')}</datalist>
        <button type="button" class="link small muted" data-a="choix-fermer">Fermer la liste</button></div>`;
    };
    const rendre = body => {
      body.innerHTML = `
        <label>Nom de la séance<input name="nom" maxlength="40" value="${esc(st.nom)}" placeholder="ex. Full body maison"></label>
        <label class="check"><input type="checkbox" name="rotation" ${st.rotation ? 'checked' : ''}> Dans l'alternance (comme Upper A / Upper B)</label>
        <p class="muted small">Sinon, elle se choisit à la main ou via le calendrier. Un bloc = un superset de 2 exercices (1 ou 3, c'est possible aussi).</p>
        ${st.blocs.map((b, i) => {
          const ech = b.nom === 'Échauffement', nb = st.blocs.length;
          return `<div class="ed-bloc">
            <div class="ed-bloc-h">${ech ? '<h3>Échauffement</h3>' : `<input name="bloc-nom" data-b="${i}" value="${esc(b.nom)}" aria-label="Nom du bloc">
              <span class="ed-btns">${fl('bloc-haut', i, null, i > 1, 'Monter le bloc')}${fl('bloc-bas', i, null, i < nb - 1, 'Descendre le bloc')}${fl('bloc-suppr', i, null, true, 'Supprimer le bloc')}</span>`}</div>
            ${b.exos.map((e, j) => htmlExo(e, i, j, b.exos.length)).join('') || `<p class="muted small">${ech ? 'Facultatif.' : 'Vide : ajoute 2 exercices pour un superset.'}</p>`}
            ${choix && choix.b === i ? htmlChoix(i) : `<button type="button" class="link small" data-a="exo+" data-b="${i}">+ ${!ech && b.exos.length === 1 ? '2e exercice du superset' : 'exercice'}</button>`}
          </div>`;
        }).join('')}
        <button type="button" class="btn exo-plus" data-a="bloc+">+ bloc</button>
        <p class="err small" data-err></p>
        <div class="actions">${existante ? '<button type="button" class="btn danger" data-a="suppr">Supprimer</button>' : ''}
          <button type="button" class="btn primary" data-a="ok">Enregistrer</button></div>`;
      brancherChips(body, (nom, v) => { if (nom === 'groupe') { choix.groupe = v; rendre(body); } });
    };
    const erreur = (body, msg) => { const p = $('[data-err]', body); p.textContent = msg; p.scrollIntoView({ block: 'center' }); };
    const ajouter = (body, def) => {
      if (st.blocs.some(b => b.exos.some(e => e.id === def.id))) return erreur(body, `« ${def.nom} » est déjà dans la séance.`);
      st.blocs[choix.b].exos.push(exoEditeur(def)); choix = null; rendre(body);
    };
    const echanger = (l, a, b) => { if (b >= 0 && b < l.length) [l[a], l[b]] = [l[b], l[a]]; };

    Sheet.ouvrir(existante ? `Modifier ${existante.nom}` : 'Créer une séance', '', body => {
      rendre(body);
      body.addEventListener('input', e => {
        const t = e.target;
        if (t.name === 'nom') st.nom = t.value;
        else if (t.name === 'bloc-nom') st.blocs[+t.dataset.b].nom = t.value;
        else if (t.dataset.k) { const x = st.blocs[+t.dataset.b].exos[+t.dataset.e]; x[t.dataset.k] = t.value.trim() === '' ? null : num(t.value); }
      });
      body.addEventListener('change', e => { if (e.target.name === 'rotation') st.rotation = e.target.checked; });
      body.addEventListener('click', e => {
        const b = e.target.closest('[data-a]');
        if (!b || b.disabled) return;
        const a = b.dataset.a, i = +b.dataset.b, j = +b.dataset.e;
        if (a === 'exo+') { choix = { b: i, groupe: (choix && choix.groupe) || (groupes[0] && groupes[0].groupe) }; rendre(body); $('.ed-choix', body).scrollIntoView({ block: 'nearest' }); }
        else if (a === 'choix-fermer') { choix = null; rendre(body); }
        else if (a === 'choisir') { const def = tous.find(x => x.id === b.dataset.id); if (def) ajouter(body, def); }
        else if (a === 'perso') {
          const nom = $('[name="perso-nom"]', body).value, def = exoParNom(nom, tous, $('[name="perso-unite"]', body).value);
          if (!def) return erreur(body, 'Écris le nom de l’exercice.');
          ajouter(body, def);
        }
        else if (a === 'exo-haut' || a === 'exo-bas') { echanger(st.blocs[i].exos, j, a === 'exo-haut' ? j - 1 : j + 1); rendre(body); }
        else if (a === 'exo-suppr') { st.blocs[i].exos.splice(j, 1); rendre(body); }
        else if (a === 'bloc+') { st.blocs.push({ nom: `Bloc ${st.blocs.filter(x => x.nom !== 'Échauffement').length + 1}`, exos: [] }); choix = { b: st.blocs.length - 1, groupe: (choix && choix.groupe) || (groupes[0] && groupes[0].groupe) }; rendre(body); $('.ed-choix', body).scrollIntoView({ block: 'nearest' }); }
        else if (a === 'bloc-haut' || a === 'bloc-bas') { echanger(st.blocs, i, a === 'bloc-haut' ? i - 1 : i + 1); choix = null; rendre(body); }
        else if (a === 'bloc-suppr') {
          if (st.blocs[i].exos.length && !confirm(`Supprimer « ${st.blocs[i].nom} » et ses exercices ?`)) return;
          st.blocs.splice(i, 1); choix = null; rendre(body);
        }
        else if (a === 'suppr') {
          if (!confirm(`Supprimer la séance « ${existante.nom} » ? Les séances déjà faites et l'historique des exercices sont conservés.`)) return;
          Store.upsert('seancesTypes', { id: existante.id, supprime: true, cree: existante.cree || Date.now(), modifie: Date.now() });
          Sheet.fermer(); toast('Séance supprimée');

        else if (a === 'ok') {
          // Séance intégrée supprimée puis recréée sous le même nom : elle reprend son id (historique, planning et alternance restent liés)

          const ancienne = !existante && ((Store.programmeBase && Store.programmeBase.seances) || []).find(s => String(s.nom || '').toLowerCase() === nomBas && !visibles.some(v => v.id === s.id));
          const r = nettoyerSeanceType({ ...st, id: existante ? existante.id : ancienne ? ancienne.id : undefined }, visibles);

  },
  nouvelleSeance(sport, programmeId, date) {

    if (sport === 'muscu') {
      const prog = Store.data.programme;
      const pid = programmeId || (prog.seances && prog.seances.length ? seanceDuJour(prog, Store.data.seances, Store.data.planning, st.date) : null);
      const ps = pid && prog.seances.find(s => s.id === pid);

  },
  // date : pour saisir après coup une séance d'un autre jour (depuis le calendrier) ; le brouillon en cours est alors ignoré
  seance(existante, sportInitial, programmeId, date) {
    const edition = !!existante, autreJour = !!date && date !== today();
    let st = existante ? JSON.parse(JSON.stringify(existante)) : (autreJour ? null : LS.get(CLES.brouillon) || null);
    const brouillon = !edition && !!st;
    if (!st) st = this.nouvelleSeance(sportInitial || 'muscu', programmeId, date);
    // Une séance saisie après coup (autre jour, depuis le calendrier) ne touche pas au brouillon de la séance en cours
    const sauverBrouillon = () => { if (!edition && !autreJour) LS.set(CLES.brouillon, st); };
    let modifExo = null; // { mode: 'remplacer' | 'ajouter', i } : panneau ouvert pour changer un exercice de cette séance

    const rendre = body => {
      const sp = sportDe(st.sport), prog = Store.data.programme;
      // Séance type supprimée entre-temps (brouillon, planning) : on garde ses exercices en « Libre »
      if (st.programme && !(prog.seances || []).some(s => s.id === st.programme)) st.programme = undefined;
      body.innerHTML = `
        ${brouillon ? `<p class="note">Séance en cours reprise (brouillon gardé sur ce téléphone). <button type="button" class="link" data-a="jeter">Recommencer</button></p>` : ''}
        ${edition ? '' : chips('sport', SPORTS.map(s => ({ v: s.id, l: `${s.icone} ${s.nom}` })), st.sport)}

        <h3>Durée et effort</h3>

          <button type="button" data-a="duree" data-d="5">+5</button></div>
        <p class="muted small">Effort ressenti sur l'ensemble de la séance</p>
        ${chips('rpe', Array.from({ length: 10 }, (_, i) => ({ v: i + 1, l: String(i + 1) })), st.rpe)}
        <p class="muted small rpe-label">${st.rpe ? RPE_LABELS[st.rpe] : '1 = très facile · 10 = maximal'}</p>

        <div class="actions">${edition ? '<button type="button" class="btn danger" data-a="suppr">Supprimer</button>' : ''}
          <button type="button" class="btn primary" data-a="ok">Enregistrer</button></div>`;
      brancherChips(body, (nom, v) => {

        else if (t.name === 'note') st.note = t.value;

          const c = this.catalogueExos().find(x => slugExo(x.nom) === slugExo(t.value)), u = $('[name="exo-unite"]', body);

        else if (t.dataset.k) {
          const ex = st.exos[+t.dataset.e], s = ex.series[+t.dataset.s];
          if (ex.unite === 'min') {   // cardio : temps « m:ss » et distance (m), allure recalculée
            if (t.dataset.k === 'reps') { s.reps = lireDuree(t.value); s.tempsIllisible = !!t.value.trim() && s.reps == null; }
            else s.dist = num(t.value) > 0 ? Math.round(num(t.value)) : null;
            const p = $(`[data-allure="${t.dataset.e}"]`, body); if (p) p.innerHTML = this.texteAllure(st, +t.dataset.e);
            sauverBrouillon(); return;
          }
          s[t.dataset.k] = num(t.value);
          // Une charge modifiée est reportée sur les séries suivantes pas encore faites (ou restées sans charge)
          if (t.dataset.k === 'charge' || t.dataset.k === 'aide') { const k = t.dataset.k; ex.series.forEach((x, j) => {
            if (j > +t.dataset.s && (!x.faite || x[k] == null)) { x[k] = s[k]; const inp = $(`[data-e="${t.dataset.e}"][data-s="${j}"][data-k="${k}"]`, body); if (inp) inp.value = s[k] ?? ''; }
          }); }
        }
        sauverBrouillon();
      });
      body.addEventListener('change', e => {
        // Temps cardio : remis au format m:ss en quittant le champ (« 2 » → « 2:00 »)
        const t = e.target;
        if (t.dataset.k === 'reps' && st.exos && st.exos[+t.dataset.e].unite === 'min') { const s = st.exos[+t.dataset.e].series[+t.dataset.s]; if (s.reps != null) t.value = fmtDuree(s.reps); }
        if (e.target.name === 'programme') {
          const ps = Store.data.programme.seances.find(s => s.id === e.target.value);
          st.programme = ps ? ps.id : undefined; st.exos = ps ? this.exosDepuisProgramme(ps) : []; // libre : on ajoute ses exercices
          modifExo = null;
          sauverBrouillon(); rendre(body);
        }
      });
      body.addEventListener('click', e => {
        const b = e.target.closest('[data-a]');
        if (!b) return;
        const a = b.dataset.a;
        if (a === 'check') {
          const ex = st.exos[+b.dataset.e], s = ex.series[+b.dataset.s];
          s.faite = !s.faite;
          const prec = ex.series[+b.dataset.s - 1];
          if (s.faite && s.reps == null) s.reps = s.prevuReps ?? (prec && prec.reps);
          if (s.faite && s.charge == null && prec && prec.charge != null) s.charge = prec.charge;
          if (s.faite && ex.assiste && s.aide == null && prec && prec.aide != null) s.aide = prec.aide;
          const ligne = b.closest('.serie');
          ligne.classList.toggle('done', s.faite);
          for (const k of ['reps', 'charge', 'aide']) { const inp = $(`[data-k="${k}"]`, ligne); if (inp) inp.value = k === 'reps' && ex.unite === 'min' ? fmtDuree(s.reps) : s[k] ?? ''; }
          if (ex.unite === 'min') { s.tempsIllisible = false; const p = $(`[data-allure="${b.dataset.e}"]`, body); if (p) p.innerHTML = this.texteAllure(st, +b.dataset.e); }
          sauverBrouillon();
        } else if (a === 'serie+') {
          const ex = st.exos[+b.dataset.e], der = ex.series[ex.series.length - 1] || {};
          ex.series.push({ prevuReps: null, prevuCharge: null, reps: der.reps ?? null, charge: der.charge ?? null, faite: false, ...(ex.assiste ? { aide: der.aide ?? null } : {}) });
          sauverBrouillon(); rendre(body);
        } else if (a === 'exo-remplacer' || a === 'exo-ajouter') {
          modifExo = { mode: a === 'exo-ajouter' ? 'ajouter' : 'remplacer', i: +b.dataset.e };
          rendre(body);
          const inp = $('[name="exo-nom"]', body); if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus(); }
        } else if (a === 'exo-annuler') {
          modifExo = null; rendre(body);
        } else if (a === 'exo-valider') {
          const nom = $('[name="exo-nom"]', body).value, def = exoParNom(nom, this.catalogueExos(), $('[name="exo-unite"]', body).value);
          if (!def) return toast("Indique le nom de l'exercice");
          if (st.exos.some((x, j) => x.id === def.id && !(modifExo.mode === 'remplacer' && j === modifExo.i))) return toast(`${def.nom} est déjà dans la séance`);
          if (modifExo.mode === 'remplacer') {
            const ancien = st.exos[modifExo.i];
            if (ancien.series.some(s => s.faite) && !confirm(`Des séries de « ${ancien.nom} » sont déjà cochées. Les remplacer ?`)) return;
            st.exos[modifExo.i] = this.exoSeance(def, ancien.bloc, ancien.series.length);
          } else st.exos.push(this.exoSeance(def, 'Ajouté', null));
          toast(modifExo.mode === 'remplacer' ? `Remplacé par ${def.nom} (cette séance seulement)` : `${def.nom} ajouté`);
          modifExo = null; sauverBrouillon(); rendre(body);
        } else if (a === 'exo-retirer') {
          const ex = st.exos[+b.dataset.e];
          if (ex.series.some(s => s.faite) ? !confirm(`Retirer « ${ex.nom} » et ses séries cochées ?`) : false) return;
          st.exos.splice(+b.dataset.e, 1); modifExo = null; sauverBrouillon(); rendre(body);
        } else if (a === 'duree') {
          st.duree = Math.max(0, (st.duree || 0) + Number(b.dataset.d)); $('[name="duree"]', body).value = st.duree; sauverBrouillon();
        } else if (a === 'jeter') {
          LS.del(CLES.brouillon); Sheet.fermer(); this.seance();
        } else if (a === 'suppr') {
          if (confirm('Supprimer cette séance ?')) { Store.remove('seances', st.id); Sheet.fermer(); toast('Séance supprimée'); }
        } else if (a === 'ok') {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(st.date || '')) return toast('Indique la date');
          const montre = nettoyerMontre(st.montre);
          if (montre.erreur) return toast(montre.erreur);
          const s = { ...st };
          if (montre.valeurs) s.montre = montre.valeurs; else delete s.montre;
          if (s.exos) s.exos = s.exos.map(({ id, nom, unite, assiste, series }) => ({ id, nom, unite, ...(assiste ? { assiste: true } : {}), series: series.map(({ tempsIllisible, ...x }) => x) }));
          Store.upsert('seances', s);
          if (!edition && !autreJour) LS.del(CLES.brouillon);
          Sheet.fermer();
          toast(s.rpe && s.duree ? `Séance enregistrée · charge ${s.rpe * s.duree}` : 'Séance enregistrée (sans effort : charge non calculée)');
        }
      });
    });
  },
  // Panneau pour remplacer un exercice ou en ajouter un (cette séance seulement) ; suggestions = exercices connus
  htmlModifExo(modif, st) {
    const cat = this.catalogueExos(), actuel = modif.mode === 'remplacer' ? st.exos[modif.i] : null;
    return `<div class="exo-edit">
      <p class="small"><b>${actuel ? `Remplacer « ${esc(actuel.nom)} »` : 'Ajouter un exercice'}</b> <span class="muted">· cette séance seulement, le programme ne change pas</span></p>
      <label>Exercice<input name="exo-nom" list="exos-connus" autocomplete="off" placeholder="ex. Rowing barre"></label>
      <datalist id="exos-connus">${cat.map(e => `<option value="${esc(e.nom)}"></option>`).join('')}</datalist>
      <label>Unité (exercice nouveau)<select name="exo-unite">${['kg', 'kg/haltère', 'poids du corps', 's', 'min'].map(u => `<option ${u === ((actuel && actuel.unite) || 'kg') ? 'selected' : ''}>${u}</option>`).join('')}</select></label>
      <p class="muted small">Un exercice déjà fait garde son historique et son graphe.</p>
      <div class="actions"><button type="button" class="btn" data-a="exo-annuler">Annuler</button>
        <button type="button" class="btn primary" data-a="exo-valider">${actuel ? 'Remplacer' : 'Ajouter'}</button></div></div>`;
  },
  htmlExos(st, prog, modif) {
    let bloc = null, h = prog.echauffement && st.programme ? `<p class="note">Échauffement : ${esc(prog.echauffement)}</p>` : '';
    st.exos.forEach((ex, i) => {
      if (ex.bloc && ex.bloc !== bloc) { bloc = ex.bloc; h += `<h3>${esc(bloc)}</h3>`; }
      const pdc = sansCharge(ex.unite), ur = uniteReps(ex.unite), cardio = ex.unite === 'min';
      h += `<div class="exo"><div class="exo-head"><b>${esc(ex.nom)}</b><span class="muted small">${esc(ex.unite || '')}</span>
          ${ex.pret ? `<span class="badge good">Prêt à monter → ${fmtNum(ex.pret)} kg</span>` : ''}</div>
        ${ex.consigne ? `<p class="muted small">${esc(ex.consigne)}</p>` : ''}
        ${ex.series.map((s, j) => `<div class="serie ${s.faite ? 'done' : ''} ${pdc && ex.assiste ? 'aidee' : ''}">
          <span class="sn">S${j + 1}</span>
          <span class="prevu">${s.prevuReps != null ? `${s.prevuReps}${pdc ? ` ${ur}` : ` ×${s.prevuCharge != null ? fmtNum(s.prevuCharge) : '?'}`}` : '—'}${ex.assiste && s.prevuAide != null ? ` · aide ${fmtNum(s.prevuAide)}` : ''}</span>
          ${cardio ? `<input type="text" data-e="${i}" data-s="${j}" data-k="reps" value="${fmtDuree(s.reps)}" placeholder="m:ss" aria-label="Temps série ${j + 1}">
            <span class="x">·</span><input type="number" inputmode="numeric" data-e="${i}" data-s="${j}" data-k="dist" value="${s.dist ?? ''}" placeholder="m" aria-label="Distance série ${j + 1} (m)">`
          : `<input type="number" inputmode="numeric" data-e="${i}" data-s="${j}" data-k="reps" value="${s.reps ?? ''}" placeholder="${ur}" aria-label="Répétitions série ${j + 1}">
          ${pdc ? (ex.assiste ? `<span class="x">aide</span><input type="text" inputmode="decimal" data-e="${i}" data-s="${j}" data-k="aide" value="${s.aide ?? ''}" placeholder="aide kg" aria-label="Aide de l’élastique série ${j + 1} (kg)">` : '<span></span><span></span>') : `<span class="x">×</span><input type="text" inputmode="decimal" data-e="${i}" data-s="${j}" data-k="charge" value="${s.charge ?? ''}" placeholder="kg" aria-label="Charge série ${j + 1}">`}`}
          <button type="button" class="check" data-a="check" data-e="${i}" data-s="${j}" aria-label="Série ${j + 1} faite">✓</button></div>`).join('')}
        ${cardio ? `<p class="muted small allure" data-allure="${i}">${this.texteAllure(st, i)}</p>` : ''}
        <div class="exo-liens"><button type="button" class="link small" data-a="serie+" data-e="${i}">+ série</button>
          <button type="button" class="link small" data-a="exo-remplacer" data-e="${i}">⇄ Remplacer</button>
          <button type="button" class="link small muted" data-a="exo-retirer" data-e="${i}">✕ Retirer</button></div>
        ${modif && modif.mode === 'remplacer' && modif.i === i ? this.htmlModifExo(modif, st) : ''}</div>`;
    });
    h += modif && modif.mode === 'ajouter' ? this.htmlModifExo(modif, st)
      : `<button type="button" class="btn exo-plus" data-a="exo-ajouter">+ exercice</button>`;
    return h;
  },
  // Allure de chaque série saisie (temps + distance), et celle de la dernière fois pour comparer
  texteAllure(st, i) {
    const ex = st.exos[i];
    const actuel = ex.series.map((s, j) => (s.tempsIllisible ? `S${j + 1} : temps illisible (ex. 2:30)` : allure500(s.reps, s.dist) ? `S${j + 1} : <b>${fmtAllure(allure500(s.reps, s.dist))}</b>` : '')).filter(Boolean);
    const avant = historiqueExo(Store.data.seances.filter(x => x.id !== st.id && x.date <= st.date), ex.id).pop();
    const ref = avant && avant.series.find(s => allure500(s.reps, s.dist));
    return [actuel.length ? actuel.join(' · ') : 'Saisis le temps et la distance : l’allure aux 500 m se calcule.',
      ref ? `Dernière fois (${fmtCourt(avant.date)}) : ${texteCardio(ref)}` : ''].filter(Boolean).join('<br>');
  },

  /* ---------- Repas ---------- */
  repas(date) {
    const st = { date: date || today(), moment: momentActuel(), onglet: 'plats', sel: null, qte: 1, q: '' };
    const menuSemaine = () => Store.data.menus.find(m => m.id === semaineMenu(today()));
    const aliments = Object.fromEntries(Store.data.aliments.map(a => [a.id, a]));

    const liste = body => {
      const q = st.q.toLowerCase();
      let h = '';
      if (st.onglet === 'plats' || st.onglet === 'foodcheri') {
        const fc = st.onglet === 'foodcheri', parCat = {};
        if (fc) for (const s of ['Plat', 'Dessert', 'Autre']) parCat[s] = [];   // ordre des rubriques FoodChéri
        for (const p of Store.data.plats) if ((p.cat === 'FoodChéri') === fc && (!q || p.nom.toLowerCase().includes(q))) {
          const c = fc ? (['Plat', 'Dessert'].includes(p.sous) ? p.sous : 'Autre') : p.cat || 'Autres';
          (parCat[c] = parCat[c] || []).push(p);
        }
        const rubriques = Object.entries(parCat).filter(([, ps]) => ps.length);
        if (fc && !q && !rubriques.length) h = '<p class="muted">Aucun plat FoodChéri : envoie un screen du plat à Claude, il l’ajoute ici.</p>';
        else h = rubriques.map(([c, ps]) => `<h3>${esc(libelleMoment(c))}</h3>` + ps.map(p =>
          `<button type="button" class="pick ${st.sel && st.sel.ref === p.id ? 'on' : ''}" data-pick="plat:${esc(p.id)}"><span>${esc(p.nom)}</span><span class="muted">${fmtKcal(p.kcal)} · ${fmtNum(p.p, 0)} g P</span></button>`).join('')).join('');
      } else {
        const m = menuSemaine(), ids = m ? m.recettes.map(r => r.id) : [];
        const rs = Store.data.recettes.filter(r => !q || r.nom.toLowerCase().includes(q)).sort((a, b) => (ids.includes(b.id) - ids.includes(a.id)) || a.nom.localeCompare(b.nom));
        h = rs.map(r => { const pp = macrosRecette(r, aliments).parPortion;
          return `<button type="button" class="pick ${st.sel && st.sel.ref === r.id ? 'on' : ''}" data-pick="recette:${esc(r.id)}"><span>${ids.includes(r.id) ? '⭐ ' : ''}${esc(r.nom)}</span><span class="muted">${fmtKcal(pp.kcal)} · ${fmtNum(pp.p, 0)} g P / portion</span></button>`; }).join('');
      }
      $('.pick-list', body).innerHTML = h || '<p class="muted">Aucun résultat.</p>';
    };
    const rendre = body => {
      body.innerHTML = `
        <div class="row2"><label>Date<input type="date" name="date" value="${st.date}" max="${today()}"></label>
          <label>Moment<select name="moment">${MOMENTS.map(m => `<option value="${m}" ${m === st.moment ? 'selected' : ''}>${libelleMoment(m)}</option>`).join('')}</select></label></div>
        ${chips('onglet', [{ v: 'plats', l: 'Plats types' }, { v: 'foodcheri', l: 'FoodChéri' }, { v: 'batch', l: 'Mes recettes' }, { v: 'libre', l: 'Libre' }], st.onglet)}
        ${st.onglet === 'libre' ? `
          <label>Nom<input name="nom" placeholder="ex. Pâtes carbo chez des amis"></label>
          <div class="grid5">
            <label>kcal<input name="kcal" type="number" inputmode="numeric"></label>
            <label>Prot. (g)<input name="p" type="text" inputmode="decimal"></label>
            <label>Gluc. (g)<input name="g" type="text" inputmode="decimal"></label>
            <label>Lip. (g)<input name="l" type="text" inputmode="decimal"></label>
            <label>Fibres (g)<input name="f" type="text" inputmode="decimal"></label></div>
          <label class="check-line"><input type="checkbox" name="garder"> Garder comme plat type</label>
          <p class="muted small">Photo ou étiquette ? Envoie-la à Claude : il estime et l'enregistre.</p>`
        : `<input type="search" name="q" placeholder="Rechercher…" value="${esc(st.q)}"><div class="pick-list"></div>
          <p class="muted small">Quantité ${st.onglet === 'batch' ? '(portions)' : ''}</p>${chips('qte', QTES, st.qte)}`}
        <div class="actions"><button type="button" class="btn primary" data-a="ok">Ajouter</button></div>`;
      brancherChips(body, (nom, v) => {
        if (nom === 'onglet') { st.onglet = v; st.sel = null; rendre(body); }
        if (nom === 'qte') st.qte = Number(v);
      });
      if (st.onglet !== 'libre') liste(body);
    };

    Sheet.ouvrir('Ajouter un repas', '', body => {
      rendre(body);
      body.addEventListener('input', e => {
        if (e.target.name === 'q') { st.q = e.target.value; liste(body); }
        if (e.target.name === 'date') st.date = e.target.value;
      });
      body.addEventListener('change', e => { if (e.target.name === 'moment') st.moment = e.target.value; });
      body.addEventListener('click', e => {
        const p = e.target.closest('[data-pick]');
        if (p) {
          const [type, ref] = p.dataset.pick.split(':');
          if (type === 'plat') { const x = Store.data.plats.find(y => y.id === ref); st.sel = { source: 'plat', ref, nom: x.nom, m: x }; }
          else { const r = Store.data.recettes.find(y => y.id === ref); st.sel = { source: 'recette', ref, nom: r.nom, m: macrosRecette(r, aliments).parPortion }; }
          $$('.pick', body).forEach(x => x.classList.toggle('on', x === p));
          return;
        }
        if (!e.target.closest('[data-a="ok"]')) return;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(st.date)) return toast('Indique la date');
        let item;
        if (st.onglet === 'libre') {
          const v = n => num($(`[name="${n}"]`, body).value);
          const nom = $('[name="nom"]', body).value.trim();
          if (!nom || v('kcal') == null) return toast('Nom et kcal nécessaires');
          item = { nom, kcal: Math.round(v('kcal')), p: v('p') ?? 0, g: v('g') ?? 0, l: v('l') ?? 0, f: v('f') ?? 0, source: 'libre', qte: 1 };
          if ($('[name="garder"]', body).checked) Store.upsert('plats', { id: 'perso-' + uid(), nom, cat: 'Perso', kcal: item.kcal, p: item.p, g: item.g, l: item.l, f: item.f });
        } else {
          if (!st.sel) return toast('Choisis un plat');
          const k = st.qte, m = st.sel.m;
          item = { nom: st.sel.nom, source: st.sel.source, ref: st.sel.ref, qte: k, kcal: Math.round(m.kcal * k), p: r1(m.p * k), g: r1(m.g * k), l: r1(m.l * k), f: r1((m.f || 0) * k) };
        }
        Store.upsert('repas', { id: uid(), date: st.date, moment: st.moment, ...item, cree: Date.now() });
        Sheet.fermer();
        toast(`${item.nom} · ${fmtKcal(item.kcal)}`);
      });
    });
  },

  /* ---------- Planifier une séance (calendrier) ---------- */
  planifier(date, existant) {
    const d = Store.data, prog = d.programme, edition = !!existant;
    const st = existant ? { ...existant } : { id: uid(), date: date || today(), sport: 'muscu', note: '', cree: Date.now() };
    if (!edition && st.sport === 'muscu') st.programme = programmePourDate(prog, d.seances, d.planning, st.date) || undefined;
    const rendre = body => {
      body.innerHTML = `
        ${chips('sport', SPORTS.map(s => ({ v: s.id, l: `${s.icone} ${s.nom}` })), st.sport)}
        <div class="row2"><label>Date<input type="date" name="date" value="${st.date}"></label>
          <label>Heure<input type="time" name="heure" value="${esc(st.heure || '')}"></label></div>
        ${st.sport === 'muscu' && prog.seances && prog.seances.length ? `<label>Séance<select name="programme">
          ${prog.seances.map(s => `<option value="${esc(s.id)}" ${s.id === st.programme ? 'selected' : ''}>${esc(s.nom)}</option>`).join('')}
          <option value="" ${!st.programme ? 'selected' : ''}>Libre</option></select></label>` : ''}
        <label>Note<input name="note" value="${esc(st.note)}" placeholder="ex. avec Corentin, five KPMG"></label>
        ${edition ? '' : `<label>Répéter chaque semaine<select name="repeter">
          ${[1, 2, 4, 8, 12].map(n => `<option value="${n}">${n === 1 ? 'Non, une seule fois' : `Pendant ${n} semaines`}</option>`).join('')}</select></label>`}
        <div class="actions">${edition ? '<button type="button" class="btn danger" data-a="suppr">Supprimer</button>' : ''}
          <button type="button" class="btn primary" data-a="ok">${edition ? 'Enregistrer' : 'Planifier'}</button></div>`;
      brancherChips(body, (n, v) => {
        st.sport = v;
        st.programme = v === 'muscu' ? programmePourDate(prog, d.seances, d.planning.filter(p => p.id !== st.id), st.date) || undefined : undefined;
        rendre(body);
      });
    };
    Sheet.ouvrir(edition ? 'Séance prévue' : 'Planifier une séance', '', body => {
      rendre(body);
      body.addEventListener('input', e => {
        const t = e.target;
        if (t.name === 'date') st.date = t.value;
        else if (t.name === 'heure') st.heure = t.value || undefined;
        else if (t.name === 'note') st.note = t.value;
      });
      body.addEventListener('change', e => { if (e.target.name === 'programme') st.programme = e.target.value || undefined; });
      body.addEventListener('click', e => {
        const a = e.target.closest('[data-a]');
        if (!a) return;
        if (a.dataset.a === 'suppr') {
          if (confirm('Supprimer cette séance prévue ?')) { Store.remove('planning', st.id); Sheet.fermer(); toast('Séance prévue supprimée'); }
          return;
        }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(st.date || '')) return toast('Indique la date');
        const n = edition ? 1 : Number($('[name="repeter"]', body).value) || 1;
        // Même séance chaque semaine : avec 2 créneaux hebdo (ex. lundi Upper A, jeudi Upper B), l'alternance est respectée
        for (let i = 0; i < n; i++) Store.upsert('planning', { ...st, id: i ? uid() : st.id, date: addDays(st.date, 7 * i), cree: st.cree + i });
        Sheet.fermer();
        toast(n > 1 ? `${n} séances planifiées` : 'Séance planifiée');
      });
    });
  },

  /* ---------- Poids ---------- */
  poids() {
    const der = Store.data.poids.slice().sort((a, b) => a.date.localeCompare(b.date)).pop();
    const st = { date: today(), conditions: der ? der.conditions : 'salle' };
    Sheet.ouvrir('Pesée', `
      <label>Poids (kg)<input name="kg" type="text" inputmode="decimal" value="${der ? der.kg : ''}" autofocus></label>
      ${chips('conditions', [{ v: 'jeun', l: 'À jeun, maison' }, { v: 'salle', l: 'Salle, habillé' }], st.conditions)}
      <p class="muted small">Toujours dans les mêmes conditions : c'est la tendance qui compte.</p>
      <label>Date<input type="date" name="date" value="${st.date}" max="${today()}"></label>
      <div class="actions"><button type="button" class="btn primary" data-a="ok">Enregistrer</button></div>`, body => {
      brancherChips(body, (n, v) => { st.conditions = v; });
      $('[data-a="ok"]', body).addEventListener('click', () => {
        const kg = num($('[name="kg"]', body).value), date = $('[name="date"]', body).value;
        if (!kg || kg < 30 || kg > 250) return toast('Poids invalide');
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('Indique la date');
        Store.upsert('poids', { id: uid(), date, kg, conditions: st.conditions });
        Sheet.fermer(); toast(`${fmtNum(kg)} kg enregistré`);
      });
    });
  },
};

  <script>

const alimentsParId = () => Object.fromEntries(Store.data.aliments.map(a => [a.id, a]));
const parDate = (a, b) => a.date.localeCompare(b.date) || (a.cree || 0) - (b.cree || 0);

}
const carte = (titre, corps, extra = '') => `<section class="card ${extra}">${titre ? `<h2>${titre}</h2>` : ''}${corps}</section>`;
const ligneRepas = (r, avecMoment) => `<div class="li"><span><b>${esc(r.nom)}</b>${r.qte && r.qte !== 1 ? ` <span class="muted">×${fmtNum(r.qte)}</span>` : ''}<br><span class="muted small">${avecMoment !== false ? `${esc(libelleMoment(r.moment))} · ` : ''}${fmtNum(r.p, 0)} g P · ${fmtNum(r.f, 0)} g fibres</span></span>

const texteMontre = m => [m.kcal != null && `${fmtNum(m.kcal, 0)} kcal`, m.fcMoy != null && `FC moy ${m.fcMoy}`, m.fcMax != null && `FC max ${m.fcMax}`, m.charge != null && `charge montre ${m.charge}`].filter(Boolean).join(' · ');
// Graphe d'un exercice : charge max (courbe, axe gauche) et reps totales (barres, axe droit) ; minutes pour le cardio
function grapheExo(ex, h) {
  const opt = Graphs.base(), cardio = ex.unite === 'min', avecAide = h.some(x => x.aide != null);
  const avecCharge = (!sansCharge(ex.unite) && h.some(x => x.max != null)) || avecAide;

  const barres = { type: 'bar', label: cardio ? 'Minutes' : ex.unite === 's' ? 'Secondes au total' : 'Reps totales', data: h.map(x => cardio ? Math.round(x.reps * 10) / 10 : x.reps),
    backgroundColor: css('--series-3'), borderRadius: 3, maxBarThickness: 18, yAxisID: avecCharge ? 'y1' : 'y', order: 2 };
  const ds = [barres];

  }
  return { type: 'bar', data: { labels: h.map(x => fmtCourt(x.date)), datasets: ds }, options: opt };
}

}

const Pages = {

  /* ---------- Calendrier (vue mois : fait par le passé, prévu à venir) ---------- */

    html() {
