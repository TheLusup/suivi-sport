        const sel = this.sel;
        if (b.dataset.voir) return Pages.detailRecette(b.dataset.voir);
        if (b.dataset.por) { const x = sel[+b.dataset.por]; x.portions = Math.max(1, x.portions + Number(b.dataset.d)); return App.rendre(); }
        if (b.dataset.retirer) { sel.splice(+b.dataset.retirer, 1); return App.rendre(); }
        if (b.dataset.swap) {
          const i = +b.dataset.swap, [r] = suggererMenu(Store.data.recettes, alimentsParId(), { mois: new Date().getMonth() + 1, nb: 1, graine: Date.now(), exclure: sel.map(x => x.id) });
          if (r) sel[i] = { id: r.id, portions: sel[i].portions }; else toast('Plus d’autre recette de saison');
          return App.rendre();
        }
        const a = b.dataset.a;
        if (a === 'autre') { this.graine++; this.sel = null; App.rendre(); }
        else if (a === 'ajouter') Pages.choisirRecette(r => { sel.push({ id: r.id, portions: Store.data.profil.personnesBatch * 2 }); App.rendre(); });
        else if (a === 'valider') {
          const j = parseIso(today()).getDay() === 0 ? addDays(today(), 1) : today();
          Store.upsert('menus', { id: this.semaine, debut: debutSemaine(j), recettes: sel.map(x => ({ ...x })) }); toast('Menu enregistré');
        }
        else if (a === 'copier') {
          const txt = this.texteCourses();
          (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Liste copiée'), () => Sheet.ouvrir('Liste de courses', `<textarea rows="16" readonly>${esc(txt)}</textarea>`));
        }
      });
    },
  },
  detailRecette(id) {
    const r = Store.data.recettes.find(x => x.id === id), al = alimentsParId(), m = macrosRecette(r, al);
    const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
    Sheet.ouvrir(r.nom, `
      <p class="muted small">${fmtNum(r.portions, 0)} portions · ${fmtNum(r.temps, 0)} min · se garde ${fmtNum(r.conservation, 0)} jours · ${r.saisons && r.saisons.length < 12 ? 'saison : ' + r.saisons.map(x => MOIS[x - 1]).join(', ') : 'toute l’année'}</p>
      <div class="macros"><div><b>${fmtNum(m.parPortion.kcal, 0)}</b><span>kcal</span></div><div><b>${fmtNum(m.parPortion.p, 0)}</b><span>prot.</span></div>
        <div><b>${fmtNum(m.parPortion.g, 0)}</b><span>gluc.</span></div><div><b>${fmtNum(m.parPortion.l, 0)}</b><span>lip.</span></div><div><b>${fmtNum(m.parPortion.f, 0)}</b><span>fibres</span></div></div>
      <p class="muted small">Par portion, calculé à partir des ingrédients.${m.manquants.length ? ` ⚠️ Aliments inconnus : ${esc(m.manquants.join(', '))}` : ''}</p>
      <h3>Ingrédients (${fmtNum(r.portions, 0)} portions)</h3>
      <ul>${r.ingredients.map(i => `<li>${esc((al[i.a] || { nom: i.a }).nom)}${i.g ? ` : ${fmtNum(i.g, 0)} g` : ''}${i.txt ? ` <span class="muted">(${esc(i.txt)})</span>` : ''}</li>`).join('')}</ul>
      <h3>Étapes</h3><ol>${(r.etapes || []).map(e => `<li>${esc(e)}</li>`).join('')}</ol>`);
  },
  choisirRecette(cb) {
    const al = alimentsParId();
    Sheet.ouvrir('Ajouter une recette', `<div class="list">${Store.data.recettes.slice().sort((a, b) => a.nom.localeCompare(b.nom)).map(r =>
      `<button type="button" class="li li-btn" data-r="${esc(r.id)}"><span>${esc(r.nom)}</span><span class="muted small">${fmtKcal(macrosRecette(r, al).parPortion.kcal)}</span></button>`).join('')}</div>`, body => {
      body.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) { Sheet.fermer(); cb(Store.data.recettes.find(r => r.id === b.dataset.r)); } });
    });
  },

  /* ---------- Paramètres ---------- */
  parametres: {
    titre: 'Paramètres',
    html() {
      const c = Config.lire(), p = Store.data.profil, ci = cibles(p, poidsActuel(), today());
      const champ = (n, l, v, t = 'text', extra = '') => `<label>${l}<input name="${n}" type="${t}" value="${esc(v ?? '')}" ${extra}></label>`;
      return `<header class="page-head"><h1>Paramètres</h1></header>
        <div class="grid">
        ${carte('Données', `
          ${chips('mode', [{ v: 'github', l: 'Dépôt GitHub' }, { v: 'local', l: 'Ce navigateur seulement' }], c.mode)}
          <div class="gh ${c.mode === 'github' ? '' : 'hidden'}">
            <div class="row2">${champ('owner', 'Propriétaire', c.owner)}${champ('repo', 'Dépôt (privé)', c.repo)}</div>
            <div class="row2">${champ('branche', 'Branche', c.branche)}${champ('dossier', 'Dossier', c.dossier)}</div>
            ${champ('token', 'Token GitHub', c.token, 'password', 'autocomplete="off"')}
            <label class="check-line"><input type="checkbox" name="memoriser" ${c.memoriser ? 'checked' : ''}> Mémoriser le token sur cet appareil</label>
            <p class="muted small">Token « fine-grained » limité au dépôt de données, droit <b>Contents : Read and write</b>. Il reste dans ce navigateur et n’est envoyé qu’à api.github.com.</p>
          </div>
          <div class="actions wrap"><button type="button" class="btn primary" data-a="cfg">Enregistrer et recharger</button>
            <button type="button" class="btn gh ${c.mode === 'github' ? '' : 'hidden'}" data-a="init">Initialiser le dépôt</button></div>
          <p class="muted small" id="cfg-msg">${esc(Store.etat.message || '')}${Store.enAttente() ? ` · ${Store.enAttente()} saisie(s) en attente d’envoi` : ''}</p>`)}
        ${carte('Profil et cibles', `
          <div class="row2">${champ('naissance', 'Date de naissance', p.naissance, 'date')}${champ('tailleCm', 'Taille (cm)', p.tailleCm, 'number')}</div>
          <div class="row2">${champ('poidsDepart', 'Poids de départ (kg)', p.poidsDepart, 'number', 'step="0.1"')}${champ('poidsObjectif', 'Objectif (kg)', p.poidsObjectif, 'number', 'step="0.1"')}</div>
          <div class="row2">${champ('nap', 'Niveau d’activité', p.nap, 'number', 'step="0.05" min="1.2" max="2"')}${champ('deficit', 'Déficit visé (kcal/j)', p.deficit, 'number', 'step="50"')}</div>
          <div class="row2">${champ('proteinesParKg', 'Protéines (g/kg)', p.proteinesParKg, 'number', 'step="0.1"')}${champ('fibresCible', 'Fibres (g/j)', p.fibresCible, 'number')}</div>
          <p class="small">Métabolisme de base ${fmtKcal(ci.bmr)} · dépense estimée ${fmtKcal(ci.depense)} · <b>cible ${fmtKcal(ci.kcal)}</b> · ${ci.p} g de protéines
            <br><span class="muted">Calculé sur ton poids moyen actuel (${fmtNum(poidsActuel())} kg). Niveau d’activité : 1,4 bureau + 2-3 séances/sem., 1,55 sportif régulier. Si le poids ne baisse pas après 3 semaines, baisse-le de 0,05.</span></p>
          <div class="actions"><button type="button" class="btn primary" data-a="profil">Enregistrer le profil</button></div>`)}
        ${carte('Sauvegarde', `<p class="muted small">Télécharge toutes les données en un fichier JSON.</p><div class="actions"><button type="button" class="btn" data-a="export">Télécharger</button></div>`)}
        </div>`;
    },
    apres(root) {
      const v = n => { const el = $(`[name="${n}"]`, root); return el.type === 'checkbox' ? el.checked : el.value.trim(); };
      const lireCfg = () => ({ mode: valeurChips(root, 'mode'), owner: v('owner'), repo: v('repo'), branche: v('branche') || 'main', dossier: v('dossier'), token: v('token'), memoriser: v('memoriser') });
      brancherChips(root, (n, val) => { if (n === 'mode') $$('.gh', root).forEach(x => x.classList.toggle('hidden', val !== 'github')); });
      root.addEventListener('click', async e => {
        const b = e.target.closest('[data-a]');
        if (!b) return;
        const msg = $('#cfg-msg', root);
        if (b.dataset.a === 'cfg') { Config.ecrire(lireCfg()); await App.charger(); toast(Store.etat.sync === 'erreur' ? 'Erreur de chargement' : 'Paramètres enregistrés'); }
        else if (b.dataset.a === 'init') {
          // Crée dans le dépôt les fichiers absents, avec le contenu affiché (bibliothèques intégrées, programme, profil)
          const cfg = lireCfg(), crees = [];
          msg.textContent = 'Vérification du dépôt…';
          try {
            for (const [n, f] of Object.entries(FICHIERS)) {
              if (await ghGet(cfg, f.f)) continue;
              await ghPut(cfg, f.f, Store.data[n], null, `Création de ${f.f}`);
              crees.push(f.f);
            }
            if (crees.length) { Config.ecrire(cfg); await App.charger(); toast(`${crees.length} fichier(s) créé(s) dans le dépôt`); }
            else msg.textContent = 'Tous les fichiers existent déjà : rien n’a été modifié.';
          } catch (err) { msg.textContent = err.message; }
        } else if (b.dataset.a === 'profil') {
          const p = { ...Store.data.profil };
          for (const k of ['naissance']) p[k] = v(k);
          for (const k of ['tailleCm', 'poidsDepart', 'poidsObjectif', 'nap', 'deficit', 'proteinesParKg', 'fibresCible']) { const n = num(v(k)); if (n != null) p[k] = n; }
          Store.set('profil', p); App.rendre(); toast('Profil enregistré');
        } else if (b.dataset.a === 'export') {
          const blob = new Blob([JSON.stringify(Store.data, null, 1)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = `suivi-sport-${today()}.json`; a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }
      });
    },
  },
};

</script>
  <script>
/* Démarrage, navigation par onglets (#route), thème, état de synchronisation. */

const ROUTES = [
  { id: 'accueil', page: 'accueil', nom: "Aujourd'hui", court: 'Jour', icone: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"/>' },
  { id: 'calendrier', page: 'calendrier', nom: 'Calendrier', court: 'Agenda', icone: '<path d="M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zM5 9v10h14V9zm2 2h3v3H7z"/>' },
  { id: 'muscu', page: 'muscu', nom: 'Muscu', icone: '<path d="M2 10h2V8h2v8H4v-2H2zm4-4h3v12H6zm3 5h6v2H9zm6-5h3v12h-3zm3 2h2v2h2v4h-2v2h-2z"/>' },
  { id: 'charge', page: 'charge', nom: 'Charge', icone: '<rect x="4" y="11" width="4" height="9" rx="1.5"/><rect x="10" y="4" width="4" height="16" rx="1.5"/><rect x="16" y="8" width="4" height="12" rx="1.5"/>' },
  { id: 'nutrition', page: 'nutrition', nom: 'Nutrition', icone: '<path d="M12 21c-4.5 0-8-3.5-8-8 0-3.3 2-5.6 4.6-5.6 1.3 0 2.4.5 3.4 1.3 1-.8 2.1-1.3 3.4-1.3C18 7.4 20 9.7 20 13c0 4.5-3.5 8-8 8zM12 7c0-2.2 1.3-4 3.5-4.5.2 2.2-1.2 4-3.5 4.5z"/>' },
  { id: 'menus', page: 'menus', nom: 'Menus', icone: '<path d="M4 4h16v3H4zm1 5h14l-1.2 10.2A2 2 0 0 1 15.8 21H8.2a2 2 0 0 1-2-1.8z"/>' },
  { id: 'parametres', page: 'parametres', nom: 'Réglages', icone: '<path d="M12 2.5 20 6v5.5c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6z"/>' },
];

const App = {
  route() { const h = location.hash.slice(1); return ROUTES.some(r => r.id === h) ? h : 'accueil'; },
  nav() {
    $('#nav').innerHTML = ROUTES.map(r => `<a href="#${r.id}" data-route="${r.id}"><svg viewBox="0 0 24 24" aria-hidden="true">${r.icone}</svg><span class="t-l">${r.nom}</span><span class="t-c">${r.court || r.nom}</span></a>`).join('');
  },
  pill() {
    const e = Store.etat, n = Store.enAttente(), p = $('#sync');
    const [cls, txt] = e.sync === 'local' ? ['', 'Local']
      : e.sync === 'envoi' ? ['', 'Envoi…']
      : e.sync === 'erreur' ? ['bad', n ? `${n} en attente` : 'Erreur']
      : n ? ['warn', `${n} en attente`] : ['good', 'Synchronisé'];
    p.className = 'pill ' + cls; p.textContent = txt; p.title = e.message || '';
  },
  rendre() {
    const id = this.route(), page = Pages[ROUTES.find(r => r.id === id).page];
    $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.route === id));
    Graphs.detruire();
    const ancien = $('#view'), view = ancien.cloneNode(false); // remplace le nœud pour repartir sans écouteurs
    ancien.replaceWith(view);
    try { view.innerHTML = page.html(); page.apres && page.apres(view); }
    catch (err) { console.error(err); view.innerHTML = `<section class="card"><h2>Erreur d’affichage</h2><p>${esc(err.message)}</p></section>`; }
    document.title = `${page.titre} · Suivi sport`;
    this.pill();
  },
  async charger() {
    $('#view').innerHTML = '<p class="muted center">Chargement…</p>';
    try { await Store.charger(); }
    catch (err) {
      Store.etat = { sync: 'erreur', message: err.message };
      location.hash = '#parametres';
    }
    this.rendre();
  },
  theme(t) {
    document.documentElement.dataset.theme = t;
    LS.set(CLES.theme, t);
  },
  async init() {
    const t = LS.get(CLES.theme);
    if (t) this.theme(t);
    this.nav();
    window.addEventListener('hashchange', () => { Sheet.fermer(); this.rendre(); window.scrollTo(0, 0); });
    $('#btn-add').addEventListener('click', () => Saisie.menu());
    $('#btn-theme').addEventListener('click', () => { this.theme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); this.rendre(); });
    $('#btn-refresh').addEventListener('click', () => this.charger());
    Store.surChangement(() => {
      // Ne pas effacer un formulaire en cours de saisie dans la page
      const focus = document.activeElement;
      if (this.route() === 'parametres' || (focus && $('#view').contains(focus) && /INPUT|TEXTAREA|SELECT/.test(focus.tagName))) this.pill();
      else this.rendre();
    });
    await this.charger();
  },
};
document.addEventListener('DOMContentLoaded', () => App.init());
// Ouverture sans réseau (salle de sport) : copie de la page gardée par sw.js
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* hors ligne non disponible : la page marche quand même */ });
}

</script>
