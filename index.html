  <style>
/* Thème sombre par défaut, clair en option (bouton ◐). Mobile d'abord : barre d'onglets en bas, panneau de saisie qui monte du bas. */
:root {
  color-scheme: dark;
  --page: #06101c;
  --page-glow: radial-gradient(1100px 650px at 5% -10%, rgba(36, 201, 154, .16), transparent 60%), radial-gradient(900px 600px at 100% 0%, rgba(40, 80, 150, .28), transparent 60%);
  --sidebar: rgba(6, 16, 30, .82);
  --surface: #131c27;
  --surface-2: #1d2733;
  --surface-3: #283342;
  --border: rgba(255, 255, 255, .07);
  --text: #f3f6f9;
  --text-2: #b8c2ce;
  --muted: #7f8a99;
  --grid: rgba(255, 255, 255, .06);
  --axis: rgba(255, 255, 255, .14);
  --series-1: #24c99a; --series-2: #ff7a45; --series-3: #5b8cff; --series-4: #f5b83d;
  --series-5: #e86fa8; --series-6: #9b7bff; --series-7: #35c3e8; --series-8: #a0a8b4;
  --good: #24c99a; --warning: #f5b83d; --critical: #ff5c64;
  --good-text: #2fd6a4; --warning-text: #f5b83d; --critical-text: #ff6b72;
  --accent: #24c99a;
  --accent-ink: #04130e;
  --accent-soft: rgba(36, 201, 154, .16);
  --radius: 20px;
  --radius-sm: 12px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --page: #f2f4f7;
  --page-glow: radial-gradient(1100px 600px at 5% -10%, rgba(18, 169, 130, .10), transparent 60%);
  --sidebar: rgba(255, 255, 255, .85);
  --surface: #ffffff;
  --surface-2: #eff2f5;
  --surface-3: #e3e7ec;
  --border: rgba(10, 20, 40, .08);
  --text: #0b1320;
  --text-2: #4a5568;
  --muted: #7b8698;
  --grid: rgba(10, 20, 40, .06);
  --axis: rgba(10, 20, 40, .14);
  --series-1: #12a982; --series-2: #f0662f; --series-3: #4069f5; --series-4: #d99a12;
  --series-5: #d6528f; --series-6: #7a5af0; --series-7: #1aa6cc; --series-8: #8a94a2;
  --good: #12a982; --warning: #d99a12; --critical: #e5484f;
  --good-text: #0b8a68; --warning-text: #a26f00; --critical-text: #cf3a41;
  --accent: #12a982;
  --accent-ink: #ffffff;
  --accent-soft: rgba(18, 169, 130, .12);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page-glow), var(--page); background-attachment: fixed; color: var(--text);
  font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; min-height: 100vh;
}
body.no-scroll { overflow: hidden; }
a { color: var(--accent); }
h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
h3 { font-size: 13px; font-weight: 700; margin: 16px 0 6px; color: var(--text-2); }
ul, ol { padding-left: 20px; margin: 6px 0; }
li { margin: 3px 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; padding: 40px; }
.hidden { display: none !important; }
.good { color: var(--good-text); } .warn { color: var(--warning-text); } .bad { color: var(--critical-text); }

/* Navigation : barre latérale (ordinateur) / barre du bas (téléphone) */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 96px; z-index: 10;
  display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 18px 8px;
  background: var(--sidebar); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-right: 1px solid var(--border);
}
.brand { width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; text-decoration: none; font-size: 20px; }
.tabs { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 4px; border-radius: 14px; color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; }
.tabs a svg { width: 22px; height: 22px; fill: currentColor; }
.tabs a .t-c { display: none; }
.tabs a.on { color: var(--text); background: var(--accent-soft); }
.tabs a.on svg { fill: var(--accent); }
.tools { position: fixed; left: 0; bottom: 18px; width: 96px; z-index: 12; display: flex; flex-direction: column; align-items: center; gap: 8px; }
main { margin-left: 96px; padding: 28px 32px 110px; max-width: 1240px; }

.pill { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.pill.good { color: var(--good-text); } .pill.warn { color: var(--warning-text); } .pill.bad { color: var(--critical-text); background: rgba(255, 92, 100, .12); }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 15px; display: inline-grid; place-items: center; flex: none; }
.icon-btn.sm { width: 30px; height: 30px; font-size: 12px; border-radius: 10px; }
.fab { position: fixed; right: 24px; bottom: 24px; z-index: 11; width: 58px; height: 58px; border-radius: 20px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 30px; font-weight: 500; cursor: pointer; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }

@media (max-width: 760px) {
  body { font-size: 15px; }
  .sidebar { inset: auto 0 0 0; width: auto; height: auto; flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--border); gap: 0; }
  .brand, .tools .icon-btn { display: none; }
  .tabs { flex-direction: row; justify-content: space-around; }
  .tabs a { flex: 1; min-width: 0; padding: 6px 1px; font-size: 9.5px; }
  .tabs a .t-l { display: none; } .tabs a .t-c { display: block; }
  .tabs a span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { top: 16px; right: 16px; left: auto; bottom: auto; width: auto; }
  main { margin: 0; padding: 18px 16px calc(96px + env(safe-area-inset-bottom)); }
  .fab { right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); }
  h1 { font-size: 24px; padding-right: 96px; }
}

/* Page */
.page-head { margin-bottom: 16px; }
.page-head p { margin: 4px 0 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
.grid .wide { grid-column: 1 / -1; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; gap: 12px; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; min-width: 0; margin-bottom: 0; }
main > .card { margin-bottom: 16px; }
.kpi { margin: 0 0 6px; } .kpi b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; max-width: 520px; }
.quick button, .big-actions button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
.quick button span, .big-actions button span { font-size: 24px; }
.big-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.big-actions button { padding: 22px 8px; background: var(--surface-2); }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 4px 0 8px; }
.bar span { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar span.over { background: var(--warning); }
.bar.p span { background: var(--series-3); } .bar.f span { background: var(--series-4); }
.bar.p span.over, .bar.f span.over { background: var(--good); }
.mini-bars { display: grid; gap: 2px; margin: 8px 0; }

.list { display: flex; flex-direction: column; margin-top: 6px; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); text-align: left; }
.li:first-child { border-top: 0; }
.li-btn { background: none; border: 0; border-top: 1px solid var(--border); color: inherit; font: inherit; cursor: pointer; width: 100%; }
.li-btn:first-child { border-top: 0; }
.li-end { display: flex; align-items: center; gap: 6px; flex: none; text-align: right; flex-direction: row; }
.li-end:has(> .muted.small) { flex-direction: column; align-items: flex-end; gap: 0; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); margin-left: 4px; }
.badge.good { background: var(--accent-soft); color: var(--good-text); }
.note { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; color: var(--text-2); }

/* Calendrier */
.btn.sm { padding: 6px 12px; font-size: 13px; min-height: 0; }
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-head h2 { margin: 0; flex: 1; text-align: center; text-transform: capitalize; }
.cal-grille { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-jn { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; padding-bottom: 2px; }
.cal-j { min-height: 86px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 6px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; cursor: pointer; text-align: left; min-width: 0; }
.cal-j:hover { border-color: var(--accent); }
.cal-j.hors { opacity: .4; }
.cal-j.auj { border: 2px solid var(--accent); }
.cal-j.auj .cal-n { background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 6px; }
.cal-n { font-size: 12px; font-weight: 700; align-self: flex-start; }
.cal-evs { display: flex; flex-wrap: wrap; gap: 3px; }
.ev { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; font-size: 13px; line-height: 1; border: 2px solid var(--c, var(--muted)); }
.ev.fait { background: var(--c); }
.ev.a-venir { background: transparent; border-style: dashed; }
.ev.non-fait { border-color: var(--border); background: transparent; filter: grayscale(1); opacity: .5; }
.cal-leg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.cal-leg .ev { width: 14px; height: 14px; border-radius: 4px; margin-left: 8px; }
.cal-leg .ev:first-child { margin-left: 0; }
.ag { align-items: flex-start; justify-content: flex-start; }
.ag-d { flex: none; width: 74px; font-weight: 700; font-size: 13px; padding-top: 1px; }
.ag.auj .ag-d { color: var(--accent); }
.ag-l { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ag-l .non-fait { color: var(--muted); }
.badge.prevu { background: transparent; border: 1px dashed var(--accent); color: var(--accent); }
@media (max-width: 760px) {
  .cal { padding: 12px 8px; }
  .cal-grille { gap: 2px; }
  .cal-j { min-height: 56px; padding: 3px; gap: 2px; border-radius: 8px; }
  .ev { width: 18px; height: 18px; font-size: 10px; border-radius: 5px; border-width: 1.5px; }
  .cal-head .btn.sm { padding: 5px 8px; font-size: 12px; }
}

.chart { position: relative; height: 260px; }
.chart.sm { height: 200px; margin-bottom: 12px; }

/* Formulaires */
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-2); margin: 8px 0; min-width: 0; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.grid5 input { padding: 10px 6px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 520px) { .grid4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 420px) { .grid5 { grid-template-columns: repeat(3, 1fr); } }
.check-line { flex-direction: row; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--text); margin: 4px 0; }
.check-line input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.check-line.barre span { text-decoration: line-through; opacity: .55; }
.btn { font: inherit; font-weight: 600; padding: 11px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--critical-text); }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; align-items: center; }
.actions.wrap { flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-align: left; }
.link b { color: var(--text); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
[data-chips="rpe"] { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
[data-chips="rpe"] .chip { padding: 9px 0; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { font: inherit; font-weight: 700; width: 48px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; flex: none; }
.stepper label { flex-direction: row; align-items: center; margin: 0; flex: 1; font-size: 14px; }
.stepper input { text-align: center; font-weight: 700; }
.stepper.sm { gap: 4px; } .stepper.sm button { width: 28px; height: 28px; border-radius: 8px; }
.stepper.sm b { min-width: 18px; text-align: center; }

/* Séance : exercices et séries */
.exo { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px; margin: 8px 0; }
.exo p { margin: 2px 0 8px; }
.exo-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.serie { display: grid; grid-template-columns: 26px 1fr 64px 12px 70px 44px; gap: 6px; align-items: center; padding: 4px 0; }
.serie input { padding: 9px 4px; text-align: center; background: var(--surface); }
.serie .sn { font-size: 12px; font-weight: 700; color: var(--muted); }
.serie .prevu { font-size: 12px; color: var(--muted); }
.serie .x { color: var(--muted); text-align: center; font-size: 12px; }
.check { height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 18px; cursor: pointer; }
.serie.done .check { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.serie.done input { border-color: var(--accent); }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--border); }
.tbl td { padding: 7px 4px; border-bottom: 1px solid var(--border); }
.ecart.ok { color: var(--muted); } .ecart.plus { color: var(--good-text); } .ecart.moins { color: var(--warning-text); } .ecart.nonfaite { color: var(--critical-text); }
.macros { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; margin: 10px 0; }
.macros div { background: var(--surface-2); border-radius: 12px; padding: 8px 2px; display: flex; flex-direction: column; }
.macros b { font-size: 18px; } .macros span { font-size: 11px; color: var(--muted); }
.pick-list { max-height: 38vh; overflow-y: auto; margin: 8px 0; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 10px; }
.pick-list h3 { margin-top: 10px; }
.pick { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 10px 8px; margin: 2px 0; border: 0; border-radius: 10px; background: none; color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
.pick .muted { font-size: 12px; white-space: nowrap; }
.pick.on { background: var(--accent-soft); outline: 1px solid var(--accent); }

/* Panneau de saisie */
.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 620px; max-height: 92vh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; border: 1px solid var(--border); }
@media (min-width: 761px) { .sheet-back { align-items: center; } .sheet { border-radius: 22px; max-height: 88vh; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 6px; }
.sheet-head h2 { margin: 0; text-transform: none; letter-spacing: 0; font-size: 18px; color: var(--text); }
.sheet-body { overflow-y: auto; padding: 4px 16px calc(18px + env(safe-area-inset-bottom)); }
.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: var(--surface-3); color: var(--text); padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); transition: opacity .3s; max-width: calc(100vw - 32px); }
.toast.out { opacity: 0; }

</style>

  <script>
/* Calculs purs (sans DOM ni stockage) : dates, cibles nutritionnelles, charge d'entraînement, muscu, menus, courses.
   Testés par tests.html. */

/* ---------- Dates (chaînes AAAA-MM-JJ, heure locale) ---------- */
const pad2 = n => String(n).padStart(2, '0');
function isoDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function parseIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseIso(s); d.setDate(d.getDate() + n); return isoDate(d); }
function diffDays(a, b) { return Math.round((parseIso(a) - parseIso(b)) / 86400000); }
// Lundi de la semaine de la date
function debutSemaine(s) { const d = parseIso(s); const j = (d.getDay() + 6) % 7; d.setDate(d.getDate() - j); return isoDate(d); }
// Semaine du menu : le batch du dimanche est mangé la semaine suivante
function semaineMenu(s) { return semaineIso(parseIso(s).getDay() === 0 ? addDays(s, 1) : s); }
function semaineIso(s) {
  const d = parseIso(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); // jeudi de la semaine
  const an = d.getFullYear(), j1 = new Date(an, 0, 4);
  const n = 1 + Math.round(((d - j1) / 86400000 - 3 + (j1.getDay() + 6) % 7) / 7);
  return `${an}-W${pad2(n)}`;
}

/* ---------- Nutrition ---------- */
const MACROS = ['kcal', 'p', 'g', 'l', 'f'];
const r1 = x => Math.round(x * 10) / 10;

function age(naissance, date) {
  const n = parseIso(naissance), d = parseIso(date);
  let a = d.getFullYear() - n.getFullYear();
  if (d.getMonth() < n.getMonth() || (d.getMonth() === n.getMonth() && d.getDate() < n.getDate())) a--;
  return a;
}
// Métabolisme de base, formule de Mifflin-St Jeor (kcal/jour)
function bmr(poids, tailleCm, ageAns, sexe) {
  return 10 * poids + 6.25 * tailleCm - 5 * ageAns + (sexe === 'F' ? -161 : 5);
}
// Cibles du jour : dépense = BMR × niveau d'activité ; kcal = dépense − déficit, arrondi à 50
function cibles(profil, poids, date) {
  const b = bmr(poids, profil.tailleCm, age(profil.naissance, date), profil.sexe);
  const depense = b * profil.nap;
  return {
    bmr: Math.round(b), depense: Math.round(depense),
    kcal: Math.round((depense - profil.deficit) / 50) * 50,
    p: Math.round(poids * profil.proteinesParKg), f: profil.fibresCible,
  };
}
function totaux(items) {
  const t = { kcal: 0, p: 0, g: 0, l: 0, f: 0 };
  for (const it of items) for (const k of MACROS) t[k] += Number(it[k]) || 0;
  for (const k of MACROS) t[k] = k === 'kcal' ? Math.round(t[k]) : r1(t[k]);
  return t;
}
// Macros d'une recette à partir des grammes de chaque aliment (valeurs pour 100 g)
function macrosRecette(recette, aliments) {
  const t = { kcal: 0, p: 0, g: 0, l: 0, f: 0 }, manquants = [];
  for (const ing of recette.ingredients) {
    const a = aliments[ing.a];
    if (!a) { manquants.push(ing.a); continue; }
    for (const k of MACROS) t[k] += (a[k] || 0) * ing.g / 100;
  }
  const parPortion = {};
  for (const k of MACROS) parPortion[k] = k === 'kcal' ? Math.round(t[k] / recette.portions) : r1(t[k] / recette.portions);
  return { total: totaux([t]), parPortion, manquants };
}
// Moment du repas d'après l'heure
function momentRepas(heure) {
  if (heure < 10.5) return 'Petit-déjeuner';
  if (heure < 15) return 'Déjeuner';
  if (heure < 18.5) return 'Collation';
  return 'Dîner';
}

/* ---------- Poids ---------- */
// Pesées faites dans les mêmes conditions que la dernière (à jeun / salle habillé : ≈ 1 kg d'écart, à ne pas mélanger)
function peseesComparables(pesees) {
  if (!pesees.length) return [];
  const der = pesees.slice().sort((a, b) => a.date.localeCompare(b.date)).pop();
  return pesees.filter(p => (p.conditions || 'salle') === (der.conditions || 'salle'));
}
// Pour chaque pesée : moyenne des pesées des `jours` derniers jours (elle comprise). Plusieurs pesées le même jour : moyennées.
function moyenneGlissante(pesees, jours = 7) {
  const parJour = {};
  for (const p of pesees) (parJour[p.date] = parJour[p.date] || []).push(p.kg);
  const dates = Object.keys(parJour).sort();
  const val = d => parJour[d].reduce((a, b) => a + b, 0) / parJour[d].length;
  return dates.map(d => {
    const fen = dates.filter(x => x <= d && diffDays(d, x) < jours);
    return { date: d, kg: r1(val(d)), moyenne: Math.round(fen.reduce((a, x) => a + val(x), 0) / fen.length * 100) / 100 };
  });
}
// Pente (kg/semaine) par moindres carrés sur les pesées des `jours` derniers jours ; null si moins de 3 pesées ou 7 jours d'écart
function tendanceHebdo(pesees, date, jours = 28) {
  const pts = pesees.filter(p => p.date <= date && diffDays(date, p.date) < jours).map(p => [diffDays(p.date, date), p.kg]);
  if (pts.length < 3) return null;
  const xs = pts.map(p => p[0]);
  if (Math.max(...xs) - Math.min(...xs) < 7) return null;
  const mx = xs.reduce((a, b) => a + b, 0) / pts.length, my = pts.reduce((a, p) => a + p[1], 0) / pts.length;
  let num = 0, den = 0;
  for (const [x, y] of pts) { num += (x - mx) * (y - my); den += (x - mx) ** 2; }

  remove(f, id) { this.modifier({ f, op: 'remove', id }); },
  set(f, doc) { this.modifier({ f, op: 'set', doc }); },

  // Envoie la file d'attente, fichier par fichier : relit la dernière version, rejoue les opérations, écrit.
  // Un fichier en erreur est mis de côté : les autres partent quand même.
  async envoyer() {
    if (this.etat.sync === 'local' || !this.cfg || !this.cfg.token || this.bloque) return;
    if (this.envoi) { this.encore = true; return; }
    this.envoi = true;
    const erreurs = [];
    let aEnvoye = false;
    try {
      do {
        this.encore = false;
        const enEchec = new Set(erreurs.map(e => e.f));
        for (;;) {
          const file = (LS.get(CLES.file, []) || []).filter(o => !enEchec.has(o.f));
          if (!file.length) break;
          const f = file[0].f, ops = file.filter(o => o.f === f);
          this.etat = { sync: 'envoi', message: '' }; this.notifier();
          try {
            for (let essai = 0; ; essai++) {
              const cur = await ghGet(this.cfg, FICHIERS[f].f);
              let v = cur ? cur.contenu : defaut(f);
              for (const o of ops) v = appliquer(v, o);
              try { await ghPut(this.cfg, FICHIERS[f].f, v, cur && cur.sha, `Saisie ${FICHIERS[f].f} depuis la page`); break; }
              catch (e) { if ((e.status === 409 || e.status === 422) && essai < 2) continue; throw e; }
            }
            const envoyes = new Set(ops.map(o => o.q));
            LS.set(CLES.file, (LS.get(CLES.file, []) || []).filter(o => !envoyes.has(o.q)));
            aEnvoye = true;
          } catch (e) {
            erreurs.push({ f, e }); enEchec.add(f);
            if (e.status === 0) break; // hors ligne : inutile d'essayer les autres fichiers
          }
        }
      } while (this.encore);
    } finally {
      this.envoi = false;
      if (this.bloque) { /* un rechargement a trouvé le dépôt inaccessible entre-temps : garder son message */ }
      else if (erreurs.length) {
        this.etat = { sync: 'erreur', message: erreurs.map(x => x.e.message).join(' ') + ' La saisie est gardée et sera renvoyée.', hors_ligne: erreurs.some(x => x.e.status === 0) };
        clearTimeout(this.relance);
        this.relance = setTimeout(() => this.envoyer(), 30000);
      } else if (aEnvoye || this.etat.sync === 'envoi') this.etat = { sync: 'ok', message: '' };
      this.notifier();
    }
  },
};
window.addEventListener('online', () => Store.envoyer());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Store.enAttente()) Store.envoyer(); });

  <script>
/* Briques d'interface : panneau de saisie (bas d'écran), toasts, graphiques, petits composants. */

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const JOURS_COURTS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const fmtDate = (s, opts = { weekday: 'long', day: 'numeric', month: 'long' }) => parseIso(s).toLocaleDateString('fr-FR', opts);
const fmtCourt = s => { const d = parseIso(s); return `${JOURS_COURTS[d.getDay()]} ${d.getDate()}/${pad2(d.getMonth() + 1)}`; };
const fmtKcal = x => `${fmtNum(Math.round(x || 0), 0)} kcal`;

/* ---------- Panneau de saisie ---------- */
const Sheet = {
  ouvrir(titre, html, init) {
    this.fermer();
    const el = document.createElement('div');
    el.className = 'sheet-back';
    el.innerHTML = `<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titre)}">
      <header class="sheet-head"><h2>${esc(titre)}</h2><button class="icon-btn" data-close type="button" aria-label="Fermer">✕</button></header>
      <div class="sheet-body">${html}</div></section>`;
    // Fermeture par ✕ seulement : un tap à côté ne doit pas effacer une saisie en cours
    el.addEventListener('click', e => { if (e.target.closest('[data-close]')) this.fermer(); });
    document.body.appendChild(el);
    document.body.classList.add('no-scroll');
    this.el = el;
    if (init) init($('.sheet-body', el));
    return el;
  },
  corps() { return this.el && $('.sheet-body', this.el); },
  fermer() {
    if (!this.el) return;
    this.el.remove(); this.el = null;
    document.body.classList.remove('no-scroll');
  },
};

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('out'), 2200);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- Composants ---------- */
function barre(valeur, cible, { classe = '' } = {}) {
  const pct = cible ? Math.min(100, valeur / cible * 100) : 0;
  const trop = cible && valeur > cible;
  return `<div class="bar ${classe}"><span style="width:${pct}%" class="${trop ? 'over' : ''}"></span></div>`;
}
function chips(nom, options, actif) {
  return `<div class="chips" data-chips="${nom}">${options.map(o =>
    `<button type="button" class="chip ${String(o.v) === String(actif) ? 'on' : ''}" data-v="${esc(o.v)}">${o.l}</button>`).join('')}</div>`;
}
// Active les groupes de chips d'un conteneur ; onChange(nom, valeur)
function brancherChips(root, onChange) {
  $$('[data-chips]', root).forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    $$('.chip', g).forEach(x => x.classList.toggle('on', x === b));
    onChange && onChange(g.dataset.chips, b.dataset.v);
  }));
}
const valeurChips = (root, nom) => { const b = $(`[data-chips="${nom}"] .chip.on`, root); return b ? b.dataset.v : null; };
const num = v => { if (v == null || v === '') return null; const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; };

/* ---------- Graphiques (Chart.js) ---------- */
const Graphs = {
  liste: [],
  detruire() { this.liste.forEach(c => c.destroy()); this.liste = []; },
  creer(canvas, config) {
    if (typeof Chart === 'undefined' || !canvas) return null;
    const c = new Chart(canvas, config);
    this.liste.push(c);
    return c;
  },
  base() {
    const grid = css('--grid'), text = css('--muted');
    return {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: text, boxWidth: 10, boxHeight: 10, usePointStyle: true } }, tooltip: { backgroundColor: css('--surface-3'), titleColor: css('--text'), bodyColor: css('--text-2') } },
      scales: {
        x: { grid: { display: false }, ticks: { color: text, maxRotation: 0, autoSkipPadding: 12 }, border: { color: css('--axis') } },
        y: { grid: { color: grid }, ticks: { color: text }, border: { display: false } },
      },
    };
  },
};
const COULEUR_SPORT = { muscu: '--series-1', foot: '--series-2', velo: '--series-3', squash: '--series-4', padel: '--series-5', tennis: '--series-6', course: '--series-7', autre: '--series-8' };
const couleurSport = id => css(COULEUR_SPORT[id] || '--series-8');

  <script>
/* Formulaires de saisie : séance (muscu ou autre sport), repas, poids. Pensés pour le téléphone : peu de touches, tout pré-rempli. */

const RPE_LABELS = { 1: 'Très facile', 2: 'Facile', 3: 'Modéré', 4: 'Un peu dur', 5: 'Dur', 6: 'Dur +', 7: 'Très dur', 8: 'Très dur +', 9: 'Quasi max', 10: 'Max' };
const QTES = [{ v: 0.5, l: '½' }, { v: 1, l: '1' }, { v: 1.5, l: '1½' }, { v: 2, l: '2' }];
const MOMENTS = ['Petit-déjeuner', 'Déjeuner', 'Collation', 'Dîner'];
const momentActuel = () => { const d = new Date(); return momentRepas(d.getHours() + d.getMinutes() / 60); };

const Saisie = {
  menu() {
    Sheet.ouvrir('Ajouter', `<div class="big-actions">
      <button type="button" data-a="seance"><span>🏋️</span>Séance</button>
      <button type="button" data-a="repas"><span>🍽️</span>Repas</button>
      <button type="button" data-a="poids"><span>⚖️</span>Poids</button></div>`, body => {
      body.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) this[b.dataset.a](); });
    });
  },

  /* ---------- Séance ---------- */
  exosDepuisProgramme(ps) {
    return ps.blocs.flatMap(b => b.exos.map(ex => {
      const pv = prevuExo(ex, Store.data.seances);
      return {
        id: ex.id, nom: ex.nom, bloc: b.nom, unite: ex.unite, consigne: ex.consigne, pret: pv.chargeSuggeree,
        series: Array.from({ length: ex.series }, () => ({ prevuReps: pv.reps, prevuCharge: pv.charge, reps: pv.reps, charge: pv.charge, faite: false })),
      };
    }));
  },
  nouvelleSeance(sport, programmeId, date) {
    const sp = sportDe(sport);
    const st = { id: uid(), date: date || today(), sport, duree: sp.duree, rpe: null, note: '', cree: Date.now() };
    if (sport === 'muscu') {
      const prog = Store.data.programme;
      const pid = programmeId || (prog.seances && prog.seances.length ? prochaineSeance(prog, Store.data.seances) : null);
      const ps = pid && prog.seances.find(s => s.id === pid);
      if (ps) { st.programme = ps.id; st.exos = this.exosDepuisProgramme(ps); }
    }
    return st;
  },
  // date : pour saisir après coup une séance d'un autre jour (depuis le calendrier) ; le brouillon en cours est alors ignoré
  seance(existante, sportInitial, programmeId, date) {
    const edition = !!existante, autreJour = !!date && date !== today();
    let st = existante ? JSON.parse(JSON.stringify(existante)) : (autreJour ? null : LS.get(CLES.brouillon) || null);
    const brouillon = !edition && !!st;
    if (!st) st = this.nouvelleSeance(sportInitial || 'muscu', programmeId, date);
    // Une séance saisie après coup (autre jour, depuis le calendrier) ne touche pas au brouillon de la séance en cours
    const sauverBrouillon = () => { if (!edition && !autreJour) LS.set(CLES.brouillon, st); };

    const rendre = body => {
      const sp = sportDe(st.sport), prog = Store.data.programme;
      body.innerHTML = `
        ${brouillon ? `<p class="note">Séance en cours reprise (brouillon gardé sur ce téléphone). <button type="button" class="link" data-a="jeter">Recommencer</button></p>` : ''}
        ${edition ? '' : chips('sport', SPORTS.map(s => ({ v: s.id, l: `${s.icone} ${s.nom}` })), st.sport)}
        <div class="row2"><label>Date<input type="date" name="date" value="${st.date}" max="${today()}"></label>
          ${st.sport === 'muscu' && prog.seances && !edition ? `<label>Séance<select name="programme">
            ${prog.seances.map(s => `<option value="${esc(s.id)}" ${s.id === st.programme ? 'selected' : ''}>${esc(s.nom)}</option>`).join('')}
            <option value="" ${!st.programme ? 'selected' : ''}>Libre (sans programme)</option></select></label>` : ''}
        </div>
        ${st.exos ? this.htmlExos(st, prog) : ''}
        <h3>Durée et effort</h3>
        <div class="stepper"><button type="button" data-a="duree" data-d="-5">−5</button>
          <label><input type="number" name="duree" inputmode="numeric" min="0" value="${st.duree ?? ''}"> min</label>
          <button type="button" data-a="duree" data-d="5">+5</button></div>
        <p class="muted small">Effort ressenti sur l'ensemble de la séance</p>
        ${chips('rpe', Array.from({ length: 10 }, (_, i) => ({ v: i + 1, l: String(i + 1) })), st.rpe)}
        <p class="muted small rpe-label">${st.rpe ? RPE_LABELS[st.rpe] : '1 = très facile · 10 = maximal'}</p>
        ${sp.distance ? `<label>Distance (km)<input type="text" name="distanceKm" inputmode="decimal" value="${st.distanceKm ?? ''}"></label>` : ''}
        <h3>Montre</h3>
        <p class="muted small">Facultatif : recopie le résumé de l'activité (la durée se met plus haut).</p>
        <div class="grid4">${MONTRE.map(m => `<label>${m.l}<input type="number" inputmode="numeric" name="montre.${m.k}" value="${(st.montre || {})[m.k] ?? ''}" placeholder="${m.ph}"></label>`).join('')}</div>
        <label>Note<textarea name="note" rows="2" placeholder="facultatif">${esc(st.note)}</textarea></label>
        <div class="actions">${edition ? '<button type="button" class="btn danger" data-a="suppr">Supprimer</button>' : ''}
          <button type="button" class="btn primary" data-a="ok">Enregistrer</button></div>`;
      brancherChips(body, (nom, v) => {
        if (nom === 'sport') { st = this.nouvelleSeance(v, null, st.date); sauverBrouillon(); rendre(body); }
        if (nom === 'rpe') { st.rpe = Number(v); $('.rpe-label', body).textContent = RPE_LABELS[st.rpe]; sauverBrouillon(); }
      });
    };

    Sheet.ouvrir(edition ? 'Modifier la séance' : 'Nouvelle séance', '', body => {
      rendre(body);
      body.addEventListener('input', e => {
        const t = e.target;
        if (t.name === 'date') st.date = t.value;
        else if (t.name === 'duree') st.duree = num(t.value);
        else if (t.name === 'distanceKm') st.distanceKm = num(t.value);
        else if (t.name === 'note') st.note = t.value;
        else if (t.name && t.name.startsWith('montre.')) st.montre = { ...st.montre, [t.name.slice(7)]: num(t.value) };
        else if (t.dataset.k) {
          const ex = st.exos[+t.dataset.e], s = ex.series[+t.dataset.s];
          s[t.dataset.k] = num(t.value);
          // Une charge modifiée est reportée sur les séries suivantes pas encore faites (ou restées sans charge)
          if (t.dataset.k === 'charge') ex.series.forEach((x, j) => {
            if (j > +t.dataset.s && (!x.faite || x.charge == null)) { x.charge = s.charge; const inp = $(`[data-e="${t.dataset.e}"][data-s="${j}"][data-k="charge"]`, body); if (inp) inp.value = s.charge ?? ''; }
          });
        }
        sauverBrouillon();
      });
      body.addEventListener('change', e => {
        if (e.target.name === 'programme') {
          const ps = Store.data.programme.seances.find(s => s.id === e.target.value);
          st.programme = ps ? ps.id : undefined; st.exos = ps ? this.exosDepuisProgramme(ps) : undefined;
          sauverBrouillon(); rendre(body);
        }
      });
      body.addEventListener('click', e => {
        const b = e.target.closest('[data-a]');
        if (!b) return;
        const a = b.dataset.a;
        if (a === 'check') {
          const ex = st.exos[+b.dataset.e], s = ex.series[+b.dataset.s];
          s.faite = !s.faite;
          const prec = ex.series[+b.dataset.s - 1];
          if (s.faite && s.reps == null) s.reps = s.prevuReps ?? (prec && prec.reps);
          if (s.faite && s.charge == null && prec && prec.charge != null) s.charge = prec.charge;
          const ligne = b.closest('.serie');
          ligne.classList.toggle('done', s.faite);
          for (const k of ['reps', 'charge']) { const inp = $(`[data-k="${k}"]`, ligne); if (inp) inp.value = s[k] ?? ''; }
          sauverBrouillon();
        } else if (a === 'serie+') {
          const ex = st.exos[+b.dataset.e], der = ex.series[ex.series.length - 1] || {};
          ex.series.push({ prevuReps: null, prevuCharge: null, reps: der.reps ?? null, charge: der.charge ?? null, faite: false });
          sauverBrouillon(); rendre(body);
        } else if (a === 'duree') {
          st.duree = Math.max(0, (st.duree || 0) + Number(b.dataset.d)); $('[name="duree"]', body).value = st.duree; sauverBrouillon();

        }
      });
    });
  },
  htmlExos(st, prog) {
    let bloc = null, h = prog.echauffement && st.programme ? `<p class="note">Échauffement : ${esc(prog.echauffement)}</p>` : '';
    st.exos.forEach((ex, i) => {
      if (ex.bloc && ex.bloc !== bloc) { bloc = ex.bloc; h += `<h3>${esc(bloc)}</h3>`; }
      const pdc = sansCharge(ex.unite), ur = uniteReps(ex.unite);
      h += `<div class="exo"><div class="exo-head"><b>${esc(ex.nom)}</b><span class="muted small">${esc(ex.unite || '')}</span>
          ${ex.pret ? `<span class="badge good">Prêt à monter → ${fmtNum(ex.pret)} kg</span>` : ''}</div>
        ${ex.consigne ? `<p class="muted small">${esc(ex.consigne)}</p>` : ''}
        ${ex.series.map((s, j) => `<div class="serie ${s.faite ? 'done' : ''}">
          <span class="sn">S${j + 1}</span>
          <span class="prevu">${s.prevuReps != null ? `${s.prevuReps}${pdc ? ` ${ur}` : ` ×${s.prevuCharge != null ? fmtNum(s.prevuCharge) : '?'}`}` : '—'}</span>
          <input type="number" inputmode="numeric" data-e="${i}" data-s="${j}" data-k="reps" value="${s.reps ?? ''}" placeholder="${ur}" aria-label="${ur === 'min' ? 'Minutes' : 'Répétitions'} série ${j + 1}">
          ${pdc ? '<span></span><span></span>' : `<span class="x">×</span><input type="text" inputmode="decimal" data-e="${i}" data-s="${j}" data-k="charge" value="${s.charge ?? ''}" placeholder="kg" aria-label="Charge série ${j + 1}">`}
          <button type="button" class="check" data-a="check" data-e="${i}" data-s="${j}" aria-label="Série ${j + 1} faite">✓</button></div>`).join('')}
        <button type="button" class="link small" data-a="serie+" data-e="${i}">+ série</button></div>`;
    });
    return h;
  },

  /* ---------- Repas ---------- */
  repas(date) {
    const st = { date: date || today(), moment: momentActuel(), onglet: 'plats', sel: null, qte: 1, q: '' };

            <label>Prot. (g)<input name="p" type="text" inputmode="decimal"></label>

            <label>Lip. (g)<input name="l" type="text" inputmode="decimal"></label>
            <label>Fibres (g)<input name="f" type="text" inputmode="decimal"></label></div>
          <label class="check-line"><input type="checkbox" name="garder"> Garder comme plat type</label>
          <p class="muted small">Photo ou étiquette ? Envoie-la à Claude : il estime et l'enregistre.</p>`
        : `<input type="search" name="q" placeholder="Rechercher…" value="${esc(st.q)}"><div class="pick-list"></div>
          <p class="muted small">Quantité ${st.onglet === 'batch' ? '(portions)' : ''}</p>${chips('qte', QTES, st.qte)}`}
        <div class="actions"><button type="button" class="btn primary" data-a="ok">Ajouter</button></div>`;
      brancherChips(body, (nom, v) => {
        if (nom === 'onglet') { st.onglet = v; st.sel = null; rendre(body); }
        if (nom === 'qte') st.qte = Number(v);
      });
      if (st.onglet !== 'libre') liste(body);
    };

    Sheet.ouvrir('Ajouter un repas', '', body => {
      rendre(body);
      body.addEventListener('input', e => {
        if (e.target.name === 'q') { st.q = e.target.value; liste(body); }
        if (e.target.name === 'date') st.date = e.target.value;
      });
      body.addEventListener('change', e => { if (e.target.name === 'moment') st.moment = e.target.value; });
      body.addEventListener('click', e => {
        const p = e.target.closest('[data-pick]');
        if (p) {
          const [type, ref] = p.dataset.pick.split(':');
          if (type === 'plat') { const x = Store.data.plats.find(y => y.id === ref); st.sel = { source: 'plat', ref, nom: x.nom, m: x }; }
          else { const r = Store.data.recettes.find(y => y.id === ref); st.sel = { source: 'recette', ref, nom: r.nom, m: macrosRecette(r, aliments).parPortion }; }
          $$('.pick', body).forEach(x => x.classList.toggle('on', x === p));
          return;
        }
        if (!e.target.closest('[data-a="ok"]')) return;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(st.date)) return toast('Indique la date');
        let item;
        if (st.onglet === 'libre') {
          const v = n => num($(`[name="${n}"]`, body).value);
          const nom = $('[name="nom"]', body).value.trim();
          if (!nom || v('kcal') == null) return toast('Nom et kcal nécessaires');
          item = { nom, kcal: Math.round(v('kcal')), p: v('p') ?? 0, g: v('g') ?? 0, l: v('l') ?? 0, f: v('f') ?? 0, source: 'libre', qte: 1 };
          if ($('[name="garder"]', body).checked) Store.upsert('plats', { id: 'perso-' + uid(), nom, cat: 'Perso', kcal: item.kcal, p: item.p, g: item.g, l: item.l, f: item.f });
        } else {
          if (!st.sel) return toast('Choisis un plat');
          const k = st.qte, m = st.sel.m;
          item = { nom: st.sel.nom, source: st.sel.source, ref: st.sel.ref, qte: k, kcal: Math.round(m.kcal * k), p: r1(m.p * k), g: r1(m.g * k), l: r1(m.l * k), f: r1((m.f || 0) * k) };
        }
        Store.upsert('repas', { id: uid(), date: st.date, moment: st.moment, ...item, cree: Date.now() });
        Sheet.fermer();
        toast(`${item.nom} · ${fmtKcal(item.kcal)}`);
      });
    });
  },

  /* ---------- Planifier une séance (calendrier) ---------- */
  planifier(date, existant) {
    const d = Store.data, prog = d.programme, edition = !!existant;
    const st = existant ? { ...existant } : { id: uid(), date: date || today(), sport: 'muscu', note: '', cree: Date.now() };
    if (!edition && st.sport === 'muscu') st.programme = programmePourDate(prog, d.seances, d.planning, st.date) || undefined;
    const rendre = body => {
      body.innerHTML = `
        ${chips('sport', SPORTS.map(s => ({ v: s.id, l: `${s.icone} ${s.nom}` })), st.sport)}
        <div class="row2"><label>Date<input type="date" name="date" value="${st.date}"></label>
          <label>Heure<input type="time" name="heure" value="${esc(st.heure || '')}"></label></div>
        ${st.sport === 'muscu' && prog.seances && prog.seances.length ? `<label>Séance<select name="programme">
          ${prog.seances.map(s => `<option value="${esc(s.id)}" ${s.id === st.programme ? 'selected' : ''}>${esc(s.nom)}</option>`).join('')}
          <option value="" ${!st.programme ? 'selected' : ''}>Libre</option></select></label>` : ''}
        <label>Note<input name="note" value="${esc(st.note)}" placeholder="ex. avec Corentin, five KPMG"></label>
        ${edition ? '' : `<label>Répéter chaque semaine<select name="repeter">
          ${[1, 2, 4, 8, 12].map(n => `<option value="${n}">${n === 1 ? 'Non, une seule fois' : `Pendant ${n} semaines`}</option>`).join('')}</select></label>`}
        <div class="actions">${edition ? '<button type="button" class="btn danger" data-a="suppr">Supprimer</button>' : ''}
          <button type="button" class="btn primary" data-a="ok">${edition ? 'Enregistrer' : 'Planifier'}</button></div>`;
      brancherChips(body, (n, v) => {
        st.sport = v;
        st.programme = v === 'muscu' ? programmePourDate(prog, d.seances, d.planning.filter(p => p.id !== st.id), st.date) || undefined : undefined;
        rendre(body);
      });
    };
    Sheet.ouvrir(edition ? 'Séance prévue' : 'Planifier une séance', '', body => {
      rendre(body);
      body.addEventListener('input', e => {
        const t = e.target;
        if (t.name === 'date') st.date = t.value;
        else if (t.name === 'heure') st.heure = t.value || undefined;
        else if (t.name === 'note') st.note = t.value;
      });
      body.addEventListener('change', e => { if (e.target.name === 'programme') st.programme = e.target.value || undefined; });
      body.addEventListener('click', e => {
        const a = e.target.closest('[data-a]');
        if (!a) return;
        if (a.dataset.a === 'suppr') {
          if (confirm('Supprimer cette séance prévue ?')) { Store.remove('planning', st.id); Sheet.fermer(); toast('Séance prévue supprimée'); }
          return;
        }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(st.date || '')) return toast('Indique la date');
        const n = edition ? 1 : Number($('[name="repeter"]', body).value) || 1;
        // Même séance chaque semaine : avec 2 créneaux hebdo (ex. lundi Upper A, jeudi Upper B), l'alternance est respectée
        for (let i = 0; i < n; i++) Store.upsert('planning', { ...st, id: i ? uid() : st.id, date: addDays(st.date, 7 * i), cree: st.cree + i });
        Sheet.fermer();
        toast(n > 1 ? `${n} séances planifiées` : 'Séance planifiée');
      });
    });
  },

  /* ---------- Poids ---------- */
  poids() {
    const der = Store.data.poids.slice().sort((a, b) => a.date.localeCompare(b.date)).pop();
    const st = { date: today(), conditions: der ? der.conditions : 'salle' };
    Sheet.ouvrir('Pesée', `
      <label>Poids (kg)<input name="kg" type="text" inputmode="decimal" value="${der ? der.kg : ''}" autofocus></label>
      ${chips('conditions', [{ v: 'jeun', l: 'À jeun, maison' }, { v: 'salle', l: 'Salle, habillé' }], st.conditions)}
      <p class="muted small">Toujours dans les mêmes conditions : c'est la tendance qui compte.</p>
      <label>Date<input type="date" name="date" value="${st.date}" max="${today()}"></label>
      <div class="actions"><button type="button" class="btn primary" data-a="ok">Enregistrer</button></div>`, body => {
      brancherChips(body, (n, v) => { st.conditions = v; });
      $('[data-a="ok"]', body).addEventListener('click', () => {
        const kg = num($('[name="kg"]', body).value), date = $('[name="date"]', body).value;
        if (!kg || kg < 30 || kg > 250) return toast('Poids invalide');
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('Indique la date');
        Store.upsert('poids', { id: uid(), date, kg, conditions: st.conditions });
        Sheet.fermer(); toast(`${fmtNum(kg)} kg enregistré`);
      });
    });
  },
};

</script>
  <script>
/* Vues : Aujourd'hui, Muscu, Charge, Nutrition, Menus, Paramètres. Chaque vue renvoie son HTML ; `apres(root)` branche graphiques et clics. */

const alimentsParId = () => Object.fromEntries(Store.data.aliments.map(a => [a.id, a]));
const parDate = (a, b) => a.date.localeCompare(b.date) || (a.cree || 0) - (b.cree || 0);
function poidsActuel() {
  const m = moyenneGlissante(peseesComparables(Store.data.poids));
  return m.length ? m[m.length - 1].moyenne : Store.data.profil.poidsDepart;
}
const carte = (titre, corps, extra = '') => `<section class="card ${extra}">${titre ? `<h2>${titre}</h2>` : ''}${corps}</section>`;
const ligneRepas = r => `<div class="li"><span><b>${esc(r.nom)}</b>${r.qte && r.qte !== 1 ? ` <span class="muted">×${fmtNum(r.qte)}</span>` : ''}<br><span class="muted small">${esc(r.moment)} · ${fmtNum(r.p, 0)} g P · ${fmtNum(r.f, 0)} g fibres</span></span>
  <span class="li-end">${fmtKcal(r.kcal)}<button type="button" class="icon-btn sm" data-del-repas="${esc(r.id)}" aria-label="Supprimer ${esc(r.nom)}">✕</button></span></div>`;
const texteMontre = m => [m.kcal != null && `${fmtNum(m.kcal, 0)} kcal`, m.fcMoy != null && `FC moy ${m.fcMoy}`, m.fcMax != null && `FC max ${m.fcMax}`, m.charge != null && `charge montre ${m.charge}`].filter(Boolean).join(' · ');
function ligneSeance(s) {
  const sp = sportDe(s.sport), ps = s.programme && (Store.data.programme.seances || []).find(x => x.id === s.programme);
  return `<button type="button" class="li li-btn" data-seance="${esc(s.id)}"><span>${sp.icone} <b>${esc(ps ? ps.nom : sp.nom)}</b><br><span class="muted small">${fmtCourt(s.date)} · ${s.duree != null ? fmtNum(s.duree, 0) : '?'} min${s.rpe ? ` · effort ${fmtNum(s.rpe, 0)}/10` : ''}${s.distanceKm ? ` · ${fmtNum(s.distanceKm)} km` : ''}${s.montre && s.montre.fcMoy ? ` · ❤ ${s.montre.fcMoy}` : ''}</span></span>
    <span class="li-end">${chargeSeance(s) ? `<span class="badge">${chargeSeance(s)}</span>` : '<span class="muted small">–</span>'}</span></button>`;
}
function brancherListes(root) {
  root.addEventListener('click', e => {
    const d = e.target.closest('[data-del-repas]');
    if (d) { const r = Store.data.repas.find(x => x.id === d.dataset.delRepas); if (r && confirm(`Supprimer « ${r.nom} » ?`)) Store.remove('repas', r.id); return; }
    const s = e.target.closest('[data-seance]');
    if (s) { const x = Store.data.seances.find(y => y.id === s.dataset.seance); if (x) (x.exos ? Pages.detailSeance(x) : Saisie.seance(x)); }
  });
}

const Pages = {
  /* ---------- Aujourd'hui ---------- */
  accueil: {
    titre: "Aujourd'hui",
    html() {
      const D = today(), d = Store.data, c = cibles(d.profil, poidsActuel(), D);
      const rj = d.repas.filter(r => r.date === D).sort(parDate), t = totaux(rj);
      const prog = d.programme, pid = prog.seances && prog.seances.length ? prochaineSeance(prog, d.seances) : null;
      const ps = pid && prog.seances.find(s => s.id === pid), brouillon = LS.get(CLES.brouillon);
      const lundi = debutSemaine(D), semaine = d.seances.filter(s => s.date >= lundi && s.date <= D).sort(parDate);
      const rac = ratioAiguChronique(d.seances, D), chargeSem = semaine.reduce((a, s) => a + chargeSeance(s), 0);
      const comp = peseesComparables(d.poids), pesees = moyenneGlissante(comp), derP = pesees[pesees.length - 1], tend = tendanceHebdo(comp, D);
      const reste = c.kcal - t.kcal;
      return `<header class="page-head"><h1>Aujourd'hui</h1><p class="muted">${fmtDate(D)}</p></header>
        <div class="quick">
          <button type="button" data-a="seance"><span>🏋️</span>Séance</button>
          <button type="button" data-a="repas"><span>🍽️</span>Repas</button>
          <button type="button" data-a="poids"><span>⚖️</span>Poids</button></div>
        <div class="grid">
        ${carte('Calories du jour', `
          <div class="kpi"><b>${fmtNum(t.kcal, 0)}</b><span class="muted"> / ${fmtNum(c.kcal, 0)} kcal</span></div>
          ${barre(t.kcal, c.kcal)}
          <p class="small ${reste < 0 ? 'warn' : 'muted'}">${reste >= 0 ? `Il reste ${fmtKcal(reste)}` : `${fmtKcal(-reste)} au-dessus de la cible`}</p>
          <div class="mini-bars">
            <div><span class="small">Protéines <b>${fmtNum(t.p, 0)}</b> / ${c.p} g</span>${barre(t.p, c.p, { classe: 'p' })}</div>
            <div><span class="small">Fibres <b>${fmtNum(t.f, 0)}</b> / ${c.f} g</span>${barre(t.f, c.f, { classe: 'f' })}</div></div>
          <div class="list">${rj.map(ligneRepas).join('') || '<p class="muted small">Rien de saisi aujourd’hui.</p>'}</div>`)}
        ${carte('Prochaine séance muscu', brouillon
          ? `<p>Séance commencée, pas encore enregistrée : <b>${esc(sportDe(brouillon.sport).nom)}</b> du ${fmtCourt(brouillon.date)}</p><button type="button" class="btn primary" data-a="seance">Reprendre</button>`
          : ps ? `<p class="kpi"><b>${esc(ps.nom)}</b></p><p class="muted small">${ps.blocs.flatMap(b => b.exos).map(e => esc(e.nom)).join(' · ')}</p>
              <button type="button" class="btn primary" data-a="go" data-p="${esc(ps.id)}">Commencer ${esc(ps.nom)}</button>`
          : '<p class="muted">Pas de programme.</p>')}
        ${carte('Cette semaine', `
          <div class="kpi"><b>${fmtNum(chargeSem, 0)}</b><span class="muted"> de charge · ${semaine.length} séance${semaine.length > 1 ? 's' : ''}</span></div>
          <p class="muted small">Moyenne des 4 dernières semaines : ${fmtNum(rac.chronique, 0)}${rac.ratio != null ? ` · ratio 7 j / 28 j : <b>${fmtNum(rac.ratio, 2)}</b>` : ''}</p>
          <div class="list">${semaine.map(ligneSeance).join('') || '<p class="muted small">Aucune séance cette semaine.</p>'}</div>`)}
        ${carte('Poids', derP ? `
          <div class="kpi"><b>${fmtNum(derP.moyenne)}</b><span class="muted"> kg (moyenne 7 j)</span></div>
          <p class="small muted">Dernière pesée ${fmtNum(derP.kg)} kg le ${fmtCourt(derP.date)} · objectif ${fmtNum(d.profil.poidsObjectif)} kg
            (${derP.moyenne > d.profil.poidsObjectif ? `encore ${fmtNum(derP.moyenne - d.profil.poidsObjectif)} kg` : 'atteint 🎉'})</p>
          ${tend != null ? `<p class="small">Tendance : <b>${tend > 0 ? '+' : ''}${fmtNum(tend, 2)} kg/semaine</b></p>` : '<p class="muted small">Tendance dès 3 pesées sur au moins une semaine.</p>'}`
          : '<p class="muted">Aucune pesée. Ajoute la première avec ⚖️.</p>')}
        </div>`;
    },
    apres(root) {
      root.addEventListener('click', e => {
        const b = e.target.closest('[data-a]');
        if (!b) return;
        if (b.dataset.a === 'go') Saisie.seance(null, 'muscu', b.dataset.p);
        else if (Saisie[b.dataset.a]) Saisie[b.dataset.a]();
      });
      brancherListes(root);
    },
  },

  /* ---------- Calendrier (vue mois : fait par le passé, prévu à venir) ---------- */
  calendrier: {
    titre: 'Calendrier', mois: null,
    // Événements d'un jour : séances faites + séances prévues pas encore couvertes par une séance du même sport
    evts(date) {
      const d = Store.data, D = today();
      const faits = d.seances.filter(s => s.date === date).sort(parDate);
      const prevus = d.planning.filter(p => p.date === date).sort((a, b) => (a.heure || '99').localeCompare(b.heure || '99') || (a.cree || 0) - (b.cree || 0))
        .map(p => ({ ...p, statut: statutPrevu(p, d.seances, D) }));
      return { faits, prevus, ouverts: prevus.filter(p => p.statut !== 'fait') };
    },
    nomPrevu(p) {
      const ps = p.programme && (Store.data.programme.seances || []).find(x => x.id === p.programme);
      return ps ? ps.nom : sportDe(p.sport).nom;
    },
    pastille: (sport, cls, titre) => `<span class="ev ${cls}" style="--c: var(${COULEUR_SPORT[sport] || '--series-8'})" title="${esc(titre)}">${sportDe(sport).icone}</span>`,
    html() {
      const D = today(), d = Store.data;
      if (!/^\d{4}-\d{2}$/.test(this.mois || '')) this.mois = D.slice(0, 7);
      const mois = this.mois, sem = grilleMois(mois);
      const titreMois = parseIso(mois + '-01').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      const duMois = d.seances.filter(s => s.date.startsWith(mois));
      const aVenir = d.planning.filter(p => p.date.startsWith(mois) && statutPrevu(p, d.seances, D) === 'a-venir');
      const chargeMois = duMois.reduce((a, s) => a + chargeSeance(s), 0);
      const cellule = date => {
        const e = this.evts(date), hors = date.slice(0, 7) !== mois;
        const pts = e.faits.map(s => this.pastille(s.sport, 'fait', sportDe(s.sport).nom))
          .concat(e.ouverts.map(p => this.pastille(p.sport, p.statut, `${this.nomPrevu(p)} (${p.statut === 'a-venir' ? 'prévu' : 'non fait'})`)));
        return `<button type="button" class="cal-j${hors ? ' hors' : ''}${date === D ? ' auj' : ''}${date < D ? ' passe' : ''}" data-jour="${date}" aria-label="${fmtDate(date)}">
          <span class="cal-n">${parseIso(date).getDate()}</span><span class="cal-evs">${pts.join('')}</span></button>`;
      };
      // Agenda du mois : chaque jour qui a quelque chose, dans l'ordre
      const jours = [...new Set([...duMois.map(s => s.date), ...d.planning.filter(p => p.date.startsWith(mois)).map(p => p.date)])].sort();
      const agenda = jours.map(j => {
        const e = this.evts(j);
        const lignes = e.faits.map(s => `<span>${sportDe(s.sport).icone} ${esc(this.nomPrevu(s))}${s.duree ? ` · ${fmtNum(s.duree, 0)} min` : ''}<span class="badge">${chargeSeance(s) || 'fait'}</span></span>`)
          .concat(e.ouverts.map(p => `<span class="${p.statut}">${sportDe(p.sport).icone} ${esc(this.nomPrevu(p))}${p.heure ? ` · ${esc(p.heure)}` : ''}${p.note ? ` · <span class="muted">${esc(p.note)}</span>` : ''}
            <span class="badge ${p.statut === 'a-venir' ? 'prevu' : ''}">${p.statut === 'a-venir' ? 'prévu' : 'non fait'}</span></span>`));
        return lignes.length ? `<button type="button" class="li li-btn ag${j === D ? ' auj' : ''}" data-jour="${j}"><span class="ag-d">${fmtCourt(j)}</span><span class="ag-l">${lignes.join('')}</span></button>` : '';
      }).join('');
      return `<header class="page-head"><h1>Calendrier</h1><p class="muted">Fait par le passé, prévu à venir. Touche un jour pour planifier.</p></header>
        <section class="card cal">
          <div class="cal-head"><button type="button" class="icon-btn" data-m="-1" aria-label="Mois précédent">‹</button>
            <h2>${titreMois}</h2>
            <button type="button" class="icon-btn" data-m="1" aria-label="Mois suivant">›</button>
            <button type="button" class="btn sm" data-m="0">Aujourd'hui</button></div>
          <div class="cal-grille">${['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'].map(j => `<span class="cal-jn">${j}</span>`).join('')}
            ${sem.flat().map(cellule).join('')}</div>
          <p class="cal-leg small muted"><span class="ev fait" style="--c: var(--accent)"></span> fait
            <span class="ev a-venir" style="--c: var(--accent)"></span> prévu <span class="ev non-fait"></span> prévu non fait</p>
        </section>
        <div class="grid">
        ${carte('Ce mois-ci', `<div class="kpi"><b>${duMois.length}</b><span class="muted"> séance${duMois.length > 1 ? 's' : ''} faite${duMois.length > 1 ? 's' : ''} · charge ${fmtNum(chargeMois, 0)}</span></div>
          <p class="muted small">${aVenir.length} séance${aVenir.length > 1 ? 's' : ''} prévue${aVenir.length > 1 ? 's' : ''} à venir</p>
          <button type="button" class="btn primary" data-a="planifier">+ Planifier une séance</button>`)}
        ${carte('Agenda', `<div class="list">${agenda || '<p class="muted small">Rien ce mois-ci.</p>'}</div>`, 'wide')}
        </div>`;
    },
    apres(root) {
      root.addEventListener('click', e => {
        const m = e.target.closest('[data-m]');
        if (m) { this.mois = m.dataset.m === '0' ? today().slice(0, 7) : moisVoisin(this.mois, Number(m.dataset.m)); return App.rendre(); }
        if (e.target.closest('[data-a="planifier"]')) return Saisie.planifier(this.mois === today().slice(0, 7) ? today() : this.mois + '-01');
        const j = e.target.closest('[data-jour]');
        if (j) this.jour(j.dataset.jour);
      });
    },
    jour(date) {
      const D = today(), e = this.evts(date), d = Store.data;
      const kcal = d.repas.filter(r => r.date === date).reduce((a, r) => a + (r.kcal || 0), 0);
      const pesee = d.poids.filter(p => p.date === date).pop();
      const prevu = p => `<div class="li"><span>${sportDe(p.sport).icone} <b>${esc(this.nomPrevu(p))}</b>${p.heure ? ` · ${esc(p.heure)}` : ''}<br>
          <span class="muted small">${p.statut === 'fait' ? 'Prévu et fait ✓' : p.statut === 'a-venir' ? 'Prévu' : 'Prévu, pas fait'}${p.note ? ` · ${esc(p.note)}` : ''}</span></span>
        <span class="li-end">${p.statut !== 'fait' && date <= D ? `<button type="button" class="btn sm primary" data-go="${esc(p.id)}">${date === D ? 'Commencer' : 'Saisir'}</button>` : ''}
          <button type="button" class="icon-btn sm" data-plan="${esc(p.id)}" aria-label="Modifier">✎</button></span></div>`;
      Sheet.ouvrir(fmtDate(date), `
        ${e.faits.length ? `<h3>Fait</h3><div class="list">${e.faits.map(ligneSeance).join('')}</div>` : ''}

  /* ---------- Menus et courses ---------- */
  menus: {
    titre: 'Menus', graine: 1, sel: null, semaine: null, filtreSaison: true,
    menuSauve() { return Store.data.menus.find(m => m.id === semaineMenu(today())); },
    selection() {
      const sem = semaineMenu(today()), p = Store.data.profil;
      if (this.semaine !== sem) {
        this.semaine = sem; this.sel = null;
        try { Object.keys(localStorage).filter(k => k.startsWith('sport.courses.') && k !== 'sport.courses.' + sem).forEach(k => localStorage.removeItem(k)); } catch { /* rien */ }
      }
      if (!this.sel) {
        const m = this.menuSauve();
        if (m) this.sel = m.recettes.map(x => ({ ...x }));
        else {
          const rs = suggererMenu(Store.data.recettes, alimentsParId(), { mois: new Date().getMonth() + 1, nb: 3, graine: this.graine });
          const parts = repartirPortions(rs.length, p.soireesBatch, p.personnesBatch);
          this.sel = rs.map((r, i) => ({ id: r.id, portions: parts[i] }));
        }
      }
      // Recette supprimée de la bibliothèque : retirée de la sélection elle-même (les index des boutons en dépendent)
      this.sel = this.sel.filter(x => Store.data.recettes.some(r => r.id === x.id));
      return this.sel;
    },
    html() {
      const p = Store.data.profil, al = alimentsParId(), sel = this.selection(), sauve = this.menuSauve();

      const totalPortions = sel.reduce((a, x) => a + x.portions, 0), besoin = p.soireesBatch * p.personnesBatch;
      const courses = listeCourses(sel.map(x => ({ recette: recette(x.id), portions: x.portions })), al);
      const coches = LS.get('sport.courses.' + this.semaine, []) || [];
      const mois = new Date().getMonth() + 1;
      const biblio = Store.data.recettes.filter(r => !this.filtreSaison || deSaison([r], mois).length).sort((a, b) => a.nom.localeCompare(b.nom));
      const egal = sauve && JSON.stringify(sauve.recettes) === JSON.stringify(sel);
      return `<header class="page-head"><h1>Menus et courses</h1><p class="muted">Batch du dimanche · semaine ${this.semaine.slice(-2)}</p></header>
        <div class="grid">
        ${carte('Batch de la semaine', `
          <div class="row2"><label>Soirées<input type="number" name="soirees" inputmode="numeric" min="1" max="7" value="${p.soireesBatch}"></label>
            <label>Personnes<input type="number" name="personnes" inputmode="numeric" min="1" max="6" value="${p.personnesBatch}"></label></div>

            return `<div class="li"><span><button type="button" class="link" data-voir="${esc(r.id)}"><b>${esc(r.nom)}</b></button><br>
              <span class="muted small">${fmtKcal(m.kcal)} · ${fmtNum(m.p, 0)} g P · ${fmtNum(m.f, 0)} g fibres / portion · ${fmtNum(r.temps, 0)} min</span></span>
              <span class="li-end"><span class="stepper sm"><button type="button" data-por="${i}" data-d="-1">−</button><b>${x.portions}</b><button type="button" data-por="${i}" data-d="1">+</button></span>
              <button type="button" class="icon-btn sm" data-swap="${i}" title="Changer" aria-label="Changer cette recette">⟳</button>
              <button type="button" class="icon-btn sm" data-retirer="${i}" aria-label="Retirer">✕</button></span></div>`; }).join('') || '<p class="muted small">Aucune recette.</p>'}</div>
          <div class="actions wrap">
            ${sauve ? '' : '<button type="button" class="btn" data-a="autre">Autre suggestion</button>'}
            <button type="button" class="btn" data-a="ajouter">+ Recette</button>
            ${egal ? '<span class="badge good">Menu validé</span>' : `<button type="button" class="btn primary" data-a="valider">${sauve ? 'Enregistrer les changements' : 'Valider ce menu'}</button>`}
          </div>`)}
        ${carte('Liste de courses', `<p class="muted small">Pour ${totalPortions} portions · cochée sur ce téléphone · ⓟ = placard, à vérifier</p>
          ${courses.map(g => `<h3>${esc(g.rayon)}</h3>` + g.items.map(it => `<label class="check-line ${coches.includes(it.id) ? 'barre' : ''}">
            <input type="checkbox" data-coche="${esc(it.id)}" ${coches.includes(it.id) ? 'checked' : ''}>
            <span>${esc(it.nom)}${it.placard ? ' ⓟ' : ''} <span class="muted">${it.g ? (it.pieces ? `${it.pieces} ${esc(it.unitePiece)}${it.pieces > 1 ? 's' : ''} (${fmtNum(it.g, 0)} g)` : `${fmtNum(it.g, 0)} g`) : ''}${it.txt ? ` ${esc(it.txt)}` : ''}</span></span></label>`).join('')).join('')}
          <div class="actions"><button type="button" class="btn" data-a="copier">Copier la liste</button></div>`)}
        ${carte('Bibliothèque de recettes', `${chips('saison', [{ v: 1, l: 'De saison' }, { v: 0, l: 'Toutes' }], this.filtreSaison ? 1 : 0)}
          <div class="list">${biblio.map(r => { const m = macrosRecette(r, al).parPortion;
            return `<button type="button" class="li li-btn" data-voir="${esc(r.id)}"><span><b>${esc(r.nom)}</b><br><span class="muted small">${fmtKcal(m.kcal)} · ${fmtNum(m.p, 0)} g P · ${fmtNum(r.temps, 0)} min · se garde ${fmtNum(r.conservation, 0)} j</span></span><span class="li-end">›</span></button>`; }).join('')}</div>`, 'wide')}
        </div>`;
    },
    texteCourses() {
      const al = alimentsParId(), sel = this.selection();
      return listeCourses(sel.map(x => ({ recette: Store.data.recettes.find(r => r.id === x.id), portions: x.portions })), al)
        .map(g => `${g.rayon}\n` + g.items.filter(it => !it.placard).map(it => `- ${it.nom}${it.g ? ` : ${it.pieces ? `${it.pieces} ${it.unitePiece}${it.pieces > 1 ? 's' : ''}` : `${it.g} g`}` : ''}`).join('\n'))
        .filter(t => t.includes('\n-')).join('\n\n');
    },
    apres(root) {
      brancherChips(root, (n, v) => { if (n === 'saison') { this.filtreSaison = v === '1'; App.rendre(); } });
      root.addEventListener('change', e => {
        const t = e.target;
        if (t.name === 'soirees' || t.name === 'personnes') {
          const p = { ...Store.data.profil, [t.name === 'soirees' ? 'soireesBatch' : 'personnesBatch']: Math.max(1, num(t.value) || 1) };
          Store.set('profil', p);
          if (!this.menuSauve()) { const parts = repartirPortions(this.sel.length, p.soireesBatch, p.personnesBatch); this.sel.forEach((x, i) => { x.portions = parts[i]; }); }
          App.rendre();
        }
        if (t.dataset.coche) {
          const k = 'sport.courses.' + this.semaine, c = new Set(LS.get(k, []) || []);
